function dayIndex() {
  const [y,m,d] = START_DATE.split("-").map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date(); now.setHours(0,0,0,0); start.setHours(0,0,0,0);
  const diff = Math.floor((now - start) / 86400000) + 1;
  if (diff < 1) return 1;
  if (diff > DAILY_TOPICS.length) return DAILY_TOPICS.length;
  return diff;
}

// ───────── 저장소 (아티팩트 저장소 → 브라우저 저장소 → 메모리 순으로 시도) ─────────
const mem = {};
const hasArtifactStore = typeof window !== "undefined" && !!window.storage;
let localOK = false;
try { window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); localOK = true; } catch { localOK = false; }

const store = {
  async get(key, shared) {
    if (hasArtifactStore) { try { return await window.storage.get(key, shared); } catch {} }
    if (localOK) { try { const v = window.localStorage.getItem("alo:" + key); if (v !== null) return { value: v }; } catch {} }
    return key in mem ? { value: mem[key] } : null;
  },
  async set(key, value, shared) {
    if (hasArtifactStore) { try { await window.storage.set(key, value, shared); } catch {} }
    if (localOK) { try { window.localStorage.setItem("alo:" + key, value); } catch {} }
    mem[key] = value;
    return { key, value };
  },
};
const storeMode = hasArtifactStore ? "팀 공유 저장소" : localOK ? "이 기기에 저장 중" : "임시 저장(새로고침 시 사라짐)";

function exportLog() {
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), entries }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `팀알로-기도기록-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
async function importLog(file) {
  try {
    const txt = await file.text();
    const parsed = JSON.parse(txt);
    const incoming = parsed.entries || [];
    const seen = new Set(entries.map((e) => e.id));
    let added = 0;
    incoming.forEach((e) => { if (e && e.id && !seen.has(e.id)) { entries.push(e); seen.add(e.id); added++; } });
    entries.sort((a,b) => a.ts - b.ts);
    await store.set(LOG_KEY, JSON.stringify({ entries }), true);
    alert(`${added}건의 기록을 불러왔어요. (전체 ${entries.length}건)`);
    render();
  } catch (err) { alert("파일을 읽지 못했어요. 백업 파일이 맞는지 확인해주세요."); }
}

const esc = (t) => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function todayStr(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function levelInfo(total) {
  let cur = LEVELS[0];
  for (const l of LEVELS) if (total >= l.need) cur = l;
  return cur;
}
async function loadLog() {
  const r = await store.get(LOG_KEY, true);
  if (!r) return [];
  try { return JSON.parse(r.value).entries || []; } catch { return []; }
}
async function saveEntry(entry) {
  const remote = await loadLog();
  const merged = [...remote];
  const seen = new Set(merged.map((e) => e.id));
  // 로컬에만 있던 기록도 함께 보존
  entries.forEach((e) => { if (e && e.id && !seen.has(e.id)) { merged.push(e); seen.add(e.id); } });
  if (!seen.has(entry.id)) merged.push(entry);
  merged.sort((a,b) => a.ts - b.ts);
  await store.set(LOG_KEY, JSON.stringify({ entries: merged }), true);
  return merged;
}

  const today = todayStr();

  const dates = new Set(mine.map((e) => e.date));
  let streak = 0;
  const d = new Date();
  if (!dates.has(todayStr(d))) d.setDate(d.getDate() - 1);
  while (dates.has(todayStr(d))) { streak++; d.setDate(d.getDate() - 1); }
  const todayMine = mine.filter((e) => e.date === today);
  const exp = mine.reduce((a, e) => a + (e.exp || 1), 0);
  const topicDots = new Set(todayMine.filter((e) => e.kind !== 'member').map((e) => e.topic));
  return { name, total: exp, count: mine.length, streak, todayTopics: topicDots };
}

document.getElementById("dateLine").textContent =
  new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"long" });

function mapSVG(count) {
  const lit = Math.min(count, LIGHT_SPOTS.length);
  let dots = "";
  for (let i = 0; i < lit; i++) {

    dots += `<circle cx="${x+55}" cy="${y+14}" r="5.5" fill="#ffe58a" opacity=".4"/>
             <circle cx="${x+55}" cy="${y+14}" r="1.9" class="lit" style="animation-delay:${(i%6)*0.4}s"/>`;
  }
  const cap = count === 0 ? "오늘의 첫 불빛을 기다리고 있어요" : `오늘 ${count}번의 기도 — 방글라데시에 ${lit}개의 불빛`;

      ${dots}
      <text x="34" y="46" font-size="10" fill="#9a968a">인도</text>

function renderName() {
  view.innerHTML = `<div class="card">
    <p class="intro">TEAM ALO 방글라데시 아웃리치를 위한 중보기도 공간이에요.<br>
    매일 올라오는 기도제목을 <b>따라 적으며</b> 함께 기도합니다.<br>
    닉네임을 입력하면 기도 기록이 팀원들과 함께 남아요.</p>
    <div style="display:flex;gap:8px">
      <input id="nameInput" style="flex:1" placeholder="닉네임" maxlength="20" value="${esc(name)}">
      <button id="nameBtn">시작하기</button>
    </div>
  </div>`;
  const input = document.getElementById("nameInput");
  const go = async () => {
    const n = input.value.trim();
    if (!n) return;
    name = n; nameSaved = true;
    await store.set("my-name", n);
    render();
  };
  document.getElementById("nameBtn").onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };

function renderPray() {
  const target = TOPICS[active];
  view.innerHTML = `<div class="card">
    <div class="typing-label">DAY ${dayIndex()} · PRAYER ${String(active+1).padStart(2,"0")} — 한 글자씩 따라 적으며 기도해요</div>
    <div class="typing-target" id="diff"></div>
    <textarea id="typeBox" placeholder="여기에 따라 적어주세요" spellcheck="false"></textarea>
    <div class="actions">
      <button class="ghost" id="backBtn">돌아가기</button>
      <button id="doneBtn" disabled>끝까지 적어주세요 (+2)</button>
    </div>
    <div class="or"><span>바쁘거나 타이핑이 어려우면</span></div>
    <button class="hold-btn" id="holdBtn">
      <span class="hold-fill" id="holdFill"></span>
      <span class="hold-label" id="holdLabel">🙏 3초 꾹 눌러서 마음으로 기도 (+1)</span>
    </button>
  </div>`;

  const box = document.getElementById("typeBox");
  const diff = document.getElementById("diff");
  const doneBtn = document.getElementById("doneBtn");

  const drawDiff = () => {
    typed = box.value;
    let html = "";
    for (let i = 0; i < target.length; i++) {
      let cls = "u";
      if (i < typed.length) cls = typed[i] === target[i] ? "ok" : "no";
      else if (i === typed.length) cls = "cur";
      html += `<span class="ch ${cls}">${esc(target[i])}</span>`;
    }
    diff.innerHTML = html;
    const done = typed === target;
    doneBtn.disabled = !done;
    doneBtn.textContent = done ? "기도 완료 +2" : "끝까지 적어주세요 (+2)";
  };
  box.oninput = drawDiff;
  drawDiff();
  box.focus();

  document.getElementById("backBtn").onclick = () => { active = null; typed = ""; cancelHold(); render(); };
  doneBtn.onclick = () => complete("typed");

  const holdBtn = document.getElementById("holdBtn");
  holdBtn.addEventListener("pointerdown", startHold);
  holdBtn.addEventListener("pointerup", cancelHold);
  holdBtn.addEventListener("pointerleave", cancelHold);
  holdBtn.addEventListener("contextmenu", (e) => e.preventDefault());
}

function startHold() {
  if (holdTimer) return;
  const fill = document.getElementById("holdFill");
  const label = document.getElementById("holdLabel");
  label.textContent = "기도하는 중… 🙏";
  holdTimer = setInterval(() => {
    holdProg += 100 / 60; // 3초
    if (fill) fill.style.width = holdProg + "%";
    if (holdProg >= 100) {
      clearInterval(holdTimer); holdTimer = null; holdProg = 0;
      complete("quick");
    }
  }, 50);
}
function cancelHold() {
  if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
  holdProg = 0;
  const fill = document.getElementById("holdFill");
  const label = document.getElementById("holdLabel");
  if (fill) fill.style.width = "0%";
  if (label) label.textContent = "🙏 3초 꾹 눌러서 마음으로 기도 (+1)";
}

async function complete(mode) {
  const beforeLv = levelInfo(stats(name).total).lv;
  const exp = mode === "typed" ? 2 : 1;
  const entry = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    name, date: todayStr(), ts: Date.now(), mode, exp,
    kind: "topic", topic: active + 1, day: dayIndex(),
  };
  try { entries = await saveEntry(entry); } catch { entries.push(entry); }
  const after = stats(name);
  const afterInfo = levelInfo(after.total);
  const cel = {
    exp,
    allDone: after.todayTopics.size >= 5,
    levelUp: afterInfo.lv > beforeLv ? afterInfo : null,
  };
  active = null; typed = ""; cancelHold();
  render();
  showCelebrate(cel);
}

function showCelebrate(c) {
  let conf = "";
  for (let i = 0; i < 30; i++) {
    conf += `<span class="conf" style="left:${(i*3.4+2)%100}%;background:${CONFETTI[i%CONFETTI.length]};animation-duration:${1.7+(i%5)*0.35}s;animation-delay:${(i%7)*0.12}s;border-radius:${i%3===0?'99px':'2px'}"></span>`;
  }
  const title = c.allDone ? "오늘의 기도, 모두 완주" : `기도가 올려졌습니다 +${c.exp} EXP`;
  const sub = c.allDone
    ? `${esc(name)}님이 오늘 다섯 개의 기도제목을 모두 품었어요`
    : `${esc(name)}님의 기도가 방글라데시에 불빛 하나를 밝혔어요`;
  const lvup = c.levelUp ? `<div class="cele-lv">LEVEL UP — Lv.${c.levelUp.lv} ${c.levelUp.title}</div>` : "";
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="cele" id="celeBox">${conf}
    <div class="seal"><span class="ic">🕯️</span><span class="tx">${c.allDone ? "완주" : "AMEN"}</span></div>
    <div class="cele-title">${title}</div>
    <div class="cele-sub">${sub}</div>
    ${lvup}
    <div class="cele-tap">화면을 누르면 닫힙니다</div>
  </div>`;
  document.getElementById("celeBox").onclick = () => { ov.innerHTML = ""; };
}

// 기도 온도: 최근 7일 활동 + 연속일수로 계산 (횟수는 직접 노출하지 않음)
function warmth(who) {
  const now = Date.now();
  const recent = entries.filter((e) => e.name === who && now - e.ts < 7 * 86400000);
  const pts = recent.reduce((a, e) => a + (e.exp || 1), 0);
  const st = stats(who).streak;
  const score = Math.min(100, pts * 3.2 + st * 6);
  let label, emoji, color;
  if (score >= 72)      { label = "활활 타올라요"; emoji = "🔥"; color = "#e0552c"; }
  else if (score >= 45) { label = "뜨거워요";     emoji = "🌟"; color = "#e1703c"; }
  else if (score >= 22) { label = "따뜻해요";     emoji = "🌤"; color = "#dda03c"; }
  else if (score >= 8)  { label = "데워지는 중";  emoji = "🌱"; color = "#7d9b3f"; }
  else                  { label = "잔잔해요";     emoji = "💧"; color = "#8fa8b5"; }
  return { score, pct: Math.max(8, Math.round(score)), label, emoji, color };
}

function calendarHTML() {
  const now = new Date();
  if (!calMonth) calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const startDow = first.getDay();
  const today = todayStr();

  // 날짜별 내 기도 횟수
  const byDate = {};
  entries.filter((e) => e.name === name).forEach((e) => { byDate[e.date] = (byDate[e.date] || 0) + 1; });

  const dow = ["일","월","화","수","목","금","토"].map((d) => `<div class="cal-dow">${d}</div>`).join("");
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell"></div>`;
  let monthTotal = 0, monthDays = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const c = byDate[ds] || 0;
    if (c > 0) { monthTotal += c; monthDays++; }
    const lvl = c === 0 ? "" : c >= 5 ? "l3" : c >= 3 ? "l2" : "l1";
    const cls = ["cal-cell", c > 0 ? "has" : "", lvl, ds === today ? "today" : "", ds === selDate ? "sel" : ""].filter(Boolean).join(" ");
    cells += `<div class="${cls}" ${c > 0 ? `data-date="${ds}"` : ""}><span>${d}</span><span class="cd"></span></div>`;
  }

  // 선택한 날짜의 팀 전체 기록
  let dayLog = "";
  if (selDate) {
    const list = entries.filter((e) => e.date === selDate).sort((a,b) => a.ts - b.ts);
    const [yy,mm,dd] = selDate.split("-");
    dayLog = `<div class="cal-sum"><b>${Number(mm)}월 ${Number(dd)}일</b> 기도 기록 (팀 전체 ${list.length}건)
      <div class="day-log">${
        list.length === 0 ? '<div class="empty">기록이 없어요</div>' :
        list.map((e) => `<div class="dl">
          <span class="dn">${String(e.topic).padStart(2,"0")}</span>
          <span class="dw"><b>${esc(e.name)}</b>님 ${e.mode === "quick" ? "마음으로 기도" : "따라 적으며 기도"}</span>
          <span class="dt">${new Date(e.ts).toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})}</span>
        </div>`).join("")
      }</div></div>`;
  } else {
    dayLog = `<div class="cal-sum">이번 달 <b>${monthDays}일</b> 참여 · 기도 <b>${monthTotal}</b>번<br>
      <span style="font-size:11.5px;color:#b0aea6">점이 찍힌 날짜를 누르면 그날의 팀 기록을 볼 수 있어요</span></div>`;
  }

  return `<div class="card cal">
    <div class="cal-head">
      <span class="cal-month">📅 ${y}년 ${m+1}월 기도 기록</span>
      <span class="cal-nav">
        <button id="calPrev">‹</button>
        <button id="calNext">›</button>
      </span>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
    ${dayLog}
  </div>`;
}

function teamHTML() {
  const cards = TEAM.map((m, i) => {
    const av = m.photo
      ? `<img class="av" src="${esc(m.photo)}" alt="${esc(m.name)}">`
      : `<span class="av av-txt">${esc(m.name.slice(0,1))}</span>`;
    return `<div class="mem ${expandedMember === i ? "open" : ""}" data-mem="${i}">
      ${av}
      <span class="mem-name">${esc(m.name)}</span>
      <span class="mem-role">${esc(m.role)}</span>
    </div>`;
  }).join("");
  const detail = expandedMember !== null ? (() => {
    const m = TEAM[expandedMember];
    const items = (m.prays || []).map((t) => `<li>${esc(t)}</li>`).join("");
    return `<div class="mem-detail">
      <div class="mem-detail-head">${esc(m.name)} <span>${esc(m.role)}</span></div>
      <ul class="mem-detail-body">${items}</ul>
    </div>`;
  })() : "";
  return `<div class="today-head">
      <span class="today-title">팀원을 위한 기도 <span class="today-date">${TEAM.length}명</span></span>
    </div>
    <div class="card team-card">
      <div class="mem-grid">${cards}</div>
      ${detail}
      <div class="mem-note">얼굴을 누르면 기도제목을 볼 수 있어요. 마음으로 함께 기도해 주세요 🙏</div>
    </div>`;
}

function renderMain() {
  TOPICS = todaySet().topics;
  const today = todayStr();
  const todayEntries = entries.filter((e) => e.date === today);
  const my = stats(name);
  const myLv = levelInfo(my.total);
  const allNames = [...new Set(entries.map((e) => e.name))];
  const ranking = allNames.map(stats).sort((a,b) => warmth(b.name).score - warmth(a.name).score);

  const dots = TOPICS.map((_,i) => `<i class="${my.todayTopics.has(i+1)?'on':''}"></i>`).join("");

  const guide = showGuide ? `<div class="card guide">
    <div class="guide-title">이렇게 기도해요</div>
    <ol>
      <li><b>매일</b> 다섯 개의 기도제목이 새로 열려요. 아래 <b>주황색 선이 그려진 흰 상자</b>를 하나 누르면 시작돼요</li>
      <li>기도제목을 <b>한 글자씩 따라 적으며</b> 기도하거나 (+2 EXP), 바쁘면 <b>3초 꾹 눌러</b> 마음으로 기도해요 (+1 EXP)</li>
      <li>완료하면 방글라데시 지도에 불빛이 켜지고, 내 이름이 기도 릴레이에 올라가요</li>
    </ol>
    <p class="guide-p">매일 5개를 모두 적으면 완주 ⭐ 기도가 쌓일수록 레벨도 올라가요.<br>기도 기록은 날짜별로 달력에 쌓이고, 매일 자정에 새로운 하루가 시작돼요.</p>
    <div style="text-align:right"><button id="guideClose">알겠어요!</button></div>
  </div>` : "";

  const relayRows = ranking.length === 0
    ? `<div class="empty">아직 온기가 없어요 — 첫 불씨가 되어주세요!</div>`
    : (showRecord ? ranking : ranking.slice(0,5)).map((s) => {
        const w = warmth(s.name);
        return `<div class="rk-row ${s.name===name?'me':''}">
          <span class="wm-emoji">${w.emoji}</span>
          <span class="wm-info">
            <span class="nm">${esc(s.name)}</span>
            <span class="wm-bar"><i style="width:${w.pct}%;background:${w.color}"></i></span>
          </span>
          <span class="wm-label" style="color:${w.color}">${w.label}</span>
        </div>`;
      }).join("");

  const topics = TOPICS.map((t,i) => {
    const who = [...new Set(todayEntries.filter((e) => e.topic === i+1).map((e) => e.name))];
    const mineDone = my.todayTopics.has(i+1);
    const names = who.length ? `<div class="names">${who.map((n) => `<b>${esc(n)}</b>`).join(" · ")} 기도함</div>` : "";
    return `<div class="card topic-card" data-topic="${i}">
      <div class="topic">
        <span class="num">${String(i+1).padStart(2,"0")}</span>
        <span class="topic-text">${esc(t)}</span>
        ${mineDone ? '<span class="check">오늘 완료</span>' : ""}
      </div>${names}
      <div class="tap-hint"><span>${mineDone ? "🙏 한 번 더 기도하기" : "👆 눌러서 기도하기"}</span><span class="arrow">→</span></div>
    </div>`;
  }).join("");

  view.innerHTML = `
    ${guide}
    ${mapSVG(todayEntries.length)}
    <div class="status">
      <span><b>${esc(name)}</b> <span class="lv">Lv.${myLv.lv} ${myLv.title}</span></span>
      ${my.streak > 1 ? `<span>🔥 ${my.streak}일째</span>` : ""}
      <span class="my-warm">${warmth(name).emoji} ${warmth(name).label}</span>
      <span class="dots">${dots}</span>
    </div>
    <div class="card relay">
      <div class="relay-head" id="relayHead">
        <span class="sec-title">🔥 기도 릴레이 <span class="relay-sub">우리 팀의 기도 온도</span></span>
        <span class="relay-toggle">${showRecord ? "접기 ▲" : "모두 보기 ▼"}</span>
      </div>
      ${relayRows}
    </div>
    <div class="today-head">
      <span class="today-title">DAY ${dayIndex()} · ${esc(todaySet().label)} <span class="today-date">${new Date().getMonth()+1}월 ${new Date().getDate()}일</span></span>
      <span class="today-prog">${my.todayTopics.size === 5 ? "오늘 완주 ⭐" : `${my.todayTopics.size}/5 완료`}</span>
    </div>
    ${topics}
    ${teamHTML()}
    ${calendarHTML()}
    <div class="record-link">
      <button id="guideOpen">이용 안내</button>
      <button id="expBtn">기록 백업</button>
      <button id="impBtn">백업 불러오기</button>
      <input type="file" id="impFile" accept="application/json" style="display:none">
    </div>
    <div class="store-note">💾 ${storeMode} · 전체 기록 ${entries.length}건</div>`;

  if (showGuide) document.getElementById("guideClose").onclick = async () => {
    showGuide = false; await store.set("guide-seen","1"); render();
  };
  document.getElementById("relayHead").onclick = () => { showRecord = !showRecord; render(); };
  document.getElementById("guideOpen").onclick = () => { showGuide = true; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  document.getElementById("expBtn").onclick = exportLog;
  document.getElementById("impBtn").onclick = () => document.getElementById("impFile").click();
  document.getElementById("impFile").onchange = (e) => { if (e.target.files[0]) importLog(e.target.files[0]); };
  document.querySelectorAll(".topic-card").forEach((el) => {
    el.onclick = () => { active = Number(el.dataset.topic); typed = ""; render(); };
  });
  const cp = document.getElementById("calPrev"), cn = document.getElementById("calNext");
  if (cp) cp.onclick = () => { let {y,m} = calMonth; m--; if (m < 0) { m = 11; y--; } calMonth = {y,m}; selDate = null; render(); };
  if (cn) cn.onclick = () => { let {y,m} = calMonth; m++; if (m > 11) { m = 0; y++; } calMonth = {y,m}; selDate = null; render(); };
  document.querySelectorAll(".mem[data-mem]").forEach((el) => {
    el.onclick = () => { const i = Number(el.dataset.mem); expandedMember = (expandedMember === i) ? null : i; render(); };
  });
  document.querySelectorAll(".cal-cell[data-date]").forEach((el) => {
    el.onclick = () => { selDate = (selDate === el.dataset.date) ? null : el.dataset.date; render(); };
  });
}

function render() {
  if (!nameSaved) return renderName();
  if (active !== null) return renderPray();
  renderMain();
}

// ───────── 시작 ─────────
(async () => {
  const r = await store.get("my-name");
  if (r && r.value) { name = r.value; nameSaved = true; }
  const g = await store.get("guide-seen");
  if (!g && nameSaved) showGuide = true;
  if (!nameSaved) showGuide = true;
  entries = await loadLog();
  render();
  setInterval(async () => {
    if (active !== null) return; // 타이핑 중엔 새로고침 안 함
    const fresh = await loadLog();
    const seen = new Set(entries.map((e) => e.id));
    const add = fresh.filter((e) => e && e.id && !seen.has(e.id));
    if (add.length) { entries = [...entries, ...add].sort((a,b) => a.ts - b.ts); render(); }
  }, 15000);
})();
