<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>방글라데시를 밝히는 기도 · TEAM ALO</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#05070e;color:#d8d2c4;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'맑은 고딕','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;
     padding:18px 20px 90px;transition:background 1.2s ease}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:2}
.brand{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.46em;color:#c99a52;margin-bottom:14px}
h1{text-align:center;font-size:22px;font-weight:600;letter-spacing:-.02em;color:#efe6d2;margin-bottom:10px;line-height:1.5}
.verse{text-align:center;font-size:12.5px;font-weight:400;color:#6c6455;margin-bottom:30px}
.lead{text-align:center;font-size:14px;font-weight:400;line-height:1.85;color:#b8b09c;margin-bottom:28px}
.quiet{font-size:12px;font-weight:400;color:#9c9484;text-align:center}

/* 성좌 필드 (닉네임 화면) */
.field-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%}
.st{fill:#5a6170;opacity:.5}
.st.lit{fill:#ffd79a;filter:url(#gl)}
.cline{fill:none;stroke:rgba(255,255,255,.17);stroke-width:.75;stroke-dasharray:4 5}
.pill{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 7px;
  border-radius:99px;font-size:12.5px;font-weight:400;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.45);animation:drift 14s ease-in-out infinite}
.pill .pdot{width:16px;height:16px;border-radius:99px;display:block}
.p0{background:linear-gradient(135deg,#8a4520,#4a2413);color:#ffd9bf;border:1px solid rgba(255,150,80,.35)}
.p0 .pdot{background:#ff8a45}
.p1{background:linear-gradient(135deg,#6b3fd6,#3a1f7a);color:#e5d8ff;border:1px solid rgba(150,110,255,.4);animation-delay:-4s}
.p1 .pdot{background:#a97cff}
.p2{background:linear-gradient(135deg,#8a8256,#4a462c);color:#f3edd2;border:1px solid rgba(230,220,150,.35);animation-delay:-8s}
.p2 .pdot{background:#e8dfa0}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(9px,-7px)}66%{transform:translate(-7px,6px)}}

/* 닉네임 패널 */
.nick-panel{position:relative;z-index:3;min-height:calc(100vh - 130px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.nick-h{font-size:29px;font-weight:300;line-height:1.45;color:#f2e9d5;margin-bottom:16px;letter-spacing:-.01em}
.nick-lead{font-size:14px;font-weight:300;line-height:1.85;color:#948c79;margin-bottom:34px}
.nick-box{width:100%;max-width:330px;display:flex;flex-direction:column;gap:9px}
.nick-box input{text-align:center;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);padding:15px}
.nick-box button{width:100%;padding:15px}

/* 배경 별 */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#ambient{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background .45s ease,opacity .45s ease}
#sky i{position:absolute;width:2px;height:2px;border-radius:99px;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}}

/* 입력 */
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:18px;
  padding:14px 16px;color:#f4ecd8;font-size:15px;font-family:inherit;font-weight:400}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.26)}
input:focus,textarea:focus{outline:none;border-color:#d9a355;box-shadow:0 0 0 3px rgba(217,163,85,.13)}
button{background:transparent;color:#e8c48a;border:1px solid rgba(217,163,85,.5);border-radius:9999px;padding:13px 22px;
  font-size:14px;font-weight:400;font-family:inherit;cursor:pointer;transition:all .2s}
button:hover{background:rgba(217,163,85,.1)}
button:active{transform:scale(.95)}
button.solid{background:#d9a355;border-color:#d9a355;color:#20160a;font-weight:600}
button.solid:hover{background:#e8b872}
button:disabled{border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.24);cursor:default;background:transparent}
button.plain{border:none;color:#9c9484;font-size:12.5px;font-weight:400;padding:8px}
button.plain:hover{background:none;color:#b8b09c}

/* 지도 */
.scene{position:relative;width:100vw;margin-left:calc(50% - 50vw);perspective:900px;
  perspective-origin:50% 45%;margin-bottom:2px}
.map-shell{position:relative;width:100%;max-width:700px;margin:0 auto;
  transform-style:preserve-3d;transition:transform .08s linear;will-change:transform}
.map-svg{width:100%;display:block;overflow:visible}
.sea{fill:#080d18}
.nbr{fill:#0e1420}
.land{transition:fill 1.4s ease}
.halo{transition:opacity 1.4s ease}
.lt{cursor:default}
.lt-name{fill:#d9ae7e;opacity:.62;font-weight:400;pointer-events:none;transition:opacity .2s,fill .2s}
.lt:hover .lt-name{opacity:1;fill:#ffe2ae}
.lt.on .lt-name{opacity:1;fill:#ffe2ae;font-weight:600}
.lt-glow{fill:#e8a23a}
.lt-spark{fill:#ffd479;filter:url(#glow)}
.map-shell{position:relative}
.map-cap{text-align:center;font-size:12px;font-weight:400;color:#a89f8c;margin-top:6px;letter-spacing:.03em}
.map-cap b{color:#e8c48a;font-weight:600}

/* 닉네임 목록 — 예전엔 구 위에 겹쳐서 떠 있었는데, 상단에만 몰려 보이는 게 부자연스러워서
   구 아래쪽에 별도 목록으로 분리해서 보여줌 */
.nick-list-wrap{margin-top:8px}
.nick-list-title{text-align:center;font-size:12px;font-weight:400;color:#a89f8c;margin-bottom:10px;letter-spacing:.03em}
.nick-list-title b{color:#e8c48a;font-weight:600}
.nick-list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-height:200px;overflow-y:auto;
  padding:2px;-webkit-overflow-scrolling:touch}
.nick-chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:9999px;
  font-size:12px;font-weight:400;white-space:nowrap}
.nick-chip.big{font-size:12.5px;padding:7px 15px}
.nc0{background:linear-gradient(135deg,#8a4520,#4a2413);color:#ffd9bf;border:1px solid rgba(255,150,80,.4)}
.nc0 .pdot{background:#ff8a45}
.nc1{background:linear-gradient(135deg,#6b3fd6,#3a1f7a);color:#e5d8ff;border:1px solid rgba(150,110,255,.42)}
.nc1 .pdot{background:#a97cff}
.nc2{background:linear-gradient(135deg,#8a8256,#4a462c);color:#f3edd2;border:1px solid rgba(230,220,150,.38)}
.nc2 .pdot{background:#e8dfa0}

/* 빛 정보 */
.tip{background:rgba(255,255,255,.045);border:1px solid rgba(217,163,85,.28);border-radius:18px;padding:15px 17px;margin-top:14px}
.tip-n{font-size:15px;color:#f4ecd8;font-weight:600}
.tip-n span{font-size:11.5px;color:#b0a890;font-weight:400;margin-left:8px}
.tip-t{font-size:13px;font-weight:400;line-height:1.75;color:#c2b9a2;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07)}

/* 카드 */
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;margin-bottom:14px}
.day-tag{font-size:10.5px;font-weight:600;letter-spacing:.24em;color:#c99a52;margin-bottom:12px}
.topic{font-size:16px;font-weight:400;line-height:1.95;color:#e9e0cc;word-break:keep-all}
.today-who{font-size:12px;font-weight:400;color:#a89f8c;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);line-height:1.7}
.today-who b{color:#c9a978;font-weight:600}

/* 타이핑 */
.type-stage{-webkit-tap-highlight-color:transparent}
.target{font-size:16px;line-height:2.05;font-weight:400;word-break:keep-all;margin:2px 0 16px}
.ch{transition:color .35s,text-shadow .35s}
.ch.u{color:rgba(255,255,255,.17)}
.ch.ok{color:#fff3d6;text-shadow:0 0 9px rgba(255,206,133,.85),0 0 20px rgba(255,168,74,.4)}
.ch.no{color:#ff5252;border-bottom:none}
.ch.cur{position:relative;display:inline-block;color:rgba(255,255,255,.32)}
.ch.cur::before{content:"";position:absolute;top:1px;bottom:1px;left:-2px;width:2px;background:#d9a355;
  border-radius:1px;animation:caretBlink 1s step-start infinite}
@keyframes caretBlink{50%{opacity:0}}
/* 아래는 실제로 입력하는 내용이 그대로 보이는 별도 입력창 (위 문구와 분리된 구조) */
#tb{display:block;width:100%;min-height:96px;margin:0;padding:14px 16px;box-sizing:border-box;
  border:1.5px solid rgba(217,163,85,.4);border-radius:16px;background:rgba(255,255,255,.03);
  color:#f6ecd8;font-family:inherit;font-size:16px;line-height:1.75;font-weight:400;
  resize:none;outline:none;-webkit-tap-highlight-color:transparent;transition:border-color .18s,box-shadow .18s}
#tb:focus{border-color:rgba(217,163,85,.75);box-shadow:0 0 0 3px rgba(217,163,85,.12)}
#tb::placeholder{color:rgba(255,255,255,.28)}
.pbar{height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d5326,#d9a355,#ffe2ae);transition:width .25s ease}
/* 오타 알림: 레이아웃에 영향을 주지 않도록(화면이 밀리지 않도록) 화면 상단에 뜨는
   플로팅 배지로 표시 — 위치/높이 변화 없이 opacity와 transform만으로 나타나고 사라짐 */
.type-warn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;
  transform:translate(-50%,-10px);padding:9px 16px;border-radius:9999px;
  background:rgba(255,82,82,.96);color:#fff;font-size:12.5px;font-weight:700;
  text-align:center;word-break:keep-all;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:40}
.type-warn.show{opacity:1;transform:translate(-50%,0)}
.pcap{text-align:center;font-size:12px;font-weight:400;color:#b0a890;margin-top:10px;transition:color .5s}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.card{position:relative;transition:border-color .45s ease,box-shadow .45s ease}
.pt{position:absolute;width:3px;height:3px;border-radius:99px;background:#ffd79a;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}
  18%{opacity:.9}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}

/* 바텀시트 */
.sheet-overlay{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;
  padding:0 18px max(18px,env(safe-area-inset-bottom));background:rgba(5,7,14,.58);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:fi .18s both}
.bottom-sheet{position:relative;width:100%;max-width:560px;max-height:88svh;overflow-y:auto;
  border:1px solid rgba(217,163,85,.16);border-radius:28px;
  background:linear-gradient(180deg,rgba(17,23,34,.95),rgba(9,13,21,.96));padding:24px 20px 20px;
  box-shadow:0 24px 80px rgba(0,0,0,.42);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both;
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  transition:border-color .45s ease,box-shadow .45s ease}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.sheet-title{font-size:18px;font-weight:700;line-height:1.35;color:#f4ecd8;letter-spacing:0}
.sheet-close{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;border:0;border-radius:999px;
  background:transparent;color:#9c9484;font-size:24px;line-height:1;padding:0}
.sheet-close:hover{background:rgba(255,255,255,.06);color:#f4ecd8}
.sheet-prayer-text{font-size:14px;font-weight:500;line-height:1.7;color:#c2b9a2;word-break:keep-all;margin-bottom:14px;text-align:left}
.bottom-sheet .type-stage{margin-bottom:14px}
.bottom-sheet .target{font-size:18px;line-height:1.9;margin:0 0 14px;text-align:left}
.sheet-actions{margin-top:16px}
.skip-type{display:block;width:100%;margin-top:10px;padding:6px;background:transparent;border:0;
  color:rgba(255,255,255,.4);font-size:12.5px;font-weight:400;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.skip-type:hover{color:rgba(255,255,255,.62)}
.sheet-actions .solid{width:100%;min-height:54px;border:0;border-radius:18px;background:#f4ecd8;color:#080b12;font-size:15px;font-weight:700}
.sheet-actions .solid:hover{background:#fff6df;color:#080b12}
.sheet-actions .solid:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.26)}
@keyframes sheetUp{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:none}}

/* 완료 */
#done{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 22px;background:#0a0d16;cursor:default;overflow:hidden}
.burst{position:absolute;left:50%;top:44%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:99px;
  background:radial-gradient(circle,rgba(255,224,160,.95),rgba(255,180,90,.35) 45%,transparent 70%);animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  25%{opacity:1}100%{transform:translate(-50%,-50%) scale(46);opacity:0}}
.flame{font-size:38px;animation:pop .7s cubic-bezier(.2,1.8,.4,1) both;filter:drop-shadow(0 0 22px rgba(255,190,110,.75))}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.done-t{font-size:19px;font-weight:400;color:#f4ecd8;margin-top:24px;text-align:center;line-height:1.7;animation:fi .9s .3s both}
.done-s{font-size:13px;font-weight:400;color:#b0a890;margin-top:14px;text-align:center;animation:fi .9s .55s both}
.done-confirm{width:min(240px,100%);height:54px;margin-top:40px;border:0;border-radius:18px;background:#f1f2f4;
  color:#08090b;font-size:15px;font-weight:700;animation:fi .9s 1.2s both}
.done-confirm:hover{background:#fff;color:#08090b}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 팀원 */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px}
.mem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 3px;border-radius:11px;cursor:pointer;
  border:1px solid transparent;transition:background .16s}
.mem:hover,.mem.open{background:rgba(255,255,255,.05);border-color:rgba(217,163,85,.3)}
.av{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:rgba(217,163,85,.13);color:#c9a978;font-size:15px;font-weight:600;object-fit:cover}
.mem-n{font-size:11.5px;color:#ded6c2;font-weight:400}
.mem-r{font-size:9.5px;color:#9c9484;font-weight:400}
.mem-d{margin-top:14px;padding:15px;background:rgba(217,163,85,.06);border:1px solid rgba(217,163,85,.2);border-radius:18px}
.mem-d h4{font-size:14px;font-weight:600;color:#f4ecd8;margin-bottom:10px}
.mem-d h4 span{font-size:11px;color:#c99a52;font-weight:400;margin-left:6px}
.mem-d ul{padding-left:15px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:400;line-height:1.75;color:#c2b9a2}
.mem-d li::marker{color:#c99a52}

.sec{font-size:10.5px;font-weight:600;letter-spacing:.26em;color:#9c9484;text-align:center;margin:38px 0 14px}
.note{text-align:center;font-size:11px;font-weight:400;color:#857d6a;margin-top:12px}
.hide{display:none}

/* 상단 GNB (탭 전환형) */
.topbar{position:sticky;top:0;z-index:15;width:100vw;margin-left:calc(50% - 50vw);
  padding:2px 0 10px;margin-bottom:8px;
  background:rgba(5,7,14,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar-inner{max-width:560px;margin:0 auto;padding:0;display:flex;flex-direction:column;align-items:center;gap:0}
.topbar-brand{font-size:10.5px;font-weight:600;letter-spacing:.46em;color:#c99a52;text-align:center}
.topbar-tabs{width:100%;display:flex;gap:8px;overflow-x:auto;padding:0 max(20px,env(safe-area-inset-right)) 4px max(20px,env(safe-area-inset-left));justify-content:flex-start;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-padding-inline:20px;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.topbar-tabs::-webkit-scrollbar{display:none}
.topbar-tab{flex:0 0 auto;background:transparent;border:0;color:#b6ae9a;
  border-radius:9999px;padding:9px 15px;font-size:12.5px;font-weight:600;font-family:inherit;white-space:nowrap;
  cursor:pointer;scroll-snap-align:center;transition:background .18s,color .18s,transform .18s,box-shadow .18s}
.topbar-tab:hover{background:rgba(255,255,255,.07);color:#d6cfbf}
.topbar-tab.on{background:rgba(255,255,255,.13);color:#f4ecd8;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.topbar-tab:active{transform:scale(.95)}
@media(min-width:620px){.topbar-tabs{justify-content:center;padding-left:20px;padding-right:20px;-webkit-mask-image:none;mask-image:none}}
.info-panel{margin-top:12px}
.info-panel .gnb-title{margin-bottom:18px}

/* 홈 */
.home-screen{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:12px 0 calc(24px + env(safe-area-inset-bottom))}
.home-copy{width:100%;padding-top:10px}
.home-subtitle{font-size:15px;font-weight:500;line-height:1.6;color:#b6ae9a;margin-bottom:8px}
.home-title{font-size:clamp(28px,8vw,38px);font-weight:700;line-height:1.28;color:#f4ecd8;
  letter-spacing:0;margin:0 auto;text-align:center;word-break:keep-all}
.home-copy .map-cap{margin-top:12px}
.home-orb{width:100%;display:flex;flex-direction:column;padding:16px 0 10px}
.home-orb .scene{margin-top:-8px}
.home-cta{width:100%;margin-top:20px}
.cta-main{width:100%;min-height:62px;border:0;border-radius:20px;background:#f4ecd8;color:#080b12;
  font-size:17px;font-weight:700;box-shadow:0 18px 42px rgba(0,0,0,.34)}
.cta-main:hover{background:#f4ecd8;color:#080b12}
.cta-note{font-size:12.5px;font-weight:500;color:#9d9585;margin-top:14px;text-align:center}
.cta-note b{color:#e8c48a;font-weight:600}

.gnb-title{font-size:11px;font-weight:600;letter-spacing:.22em;color:#c99a52;margin-bottom:14px}
.gnb-text{font-size:14px;font-weight:400;line-height:1.95;color:#ded6c2;word-break:keep-all;white-space:pre-line}
.ministry-info{list-style:none;margin:16px 0 0;padding:14px 16px;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;display:flex;flex-direction:column;gap:10px}
.ministry-info li{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.6;word-break:keep-all}
.ministry-info .mi-ico{font-size:14px;flex:0 0 auto}
.ministry-info .mi-label{flex:0 0 auto;font-weight:600;color:#c99a52;font-size:12px}
.ministry-info .mi-val{color:#ded6c2}
.gnb-photo{display:block;width:100%;border-radius:18px;margin-bottom:18px;object-fit:cover}
.verse-card{background:rgba(217,163,85,.08);border-left:0;border-radius:14px;
  padding:16px 18px;margin:16px 0}
.verse-card .v-text{font-size:15px;font-weight:400;font-style:italic;line-height:1.85;color:#f4ecd8;word-break:keep-all}

.flow-floating-cta{position:fixed;left:20px;right:20px;bottom:max(20px,env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto}

.gradient-orb::before,.gradient-orb::after{content:"";position:absolute;border-radius:inherit}
.gradient-orb::before{inset:-24%;
  background:radial-gradient(circle at 27% 48%, rgba(255,185,129,.95) 0 15%, transparent 38%),
    radial-gradient(circle at 74% 46%, rgba(130,2,41,.94) 0 18%, transparent 44%),

.clear-button{position:absolute;top:50%;right:11px;width:34px;height:34px;padding:0;border:0;border-radius:50%;

.clear-button span{transform:translate(-50%,-50%) rotate(45deg)}

.primary-button{position:fixed;left:20px;right:20px;bottom:max(20px,env(safe-area-inset-bottom));z-index:20;

.primary-button:hover{background:#ffffff}

.primary-button:disabled{color:rgba(17,17,17,.42);background:rgba(255,255,255,.5);cursor:default;box-shadow:none}
.welcome-screen .quiet{color:rgba(245,245,247,.68)}

@keyframes orbGradientFlow{
  0%{transform:translate3d(-3%,1%,0) rotate(0deg) scale(1.08)}

}

/* 쿠키 저장 (localStorage가 막힌 인앱 브라우저에서도 자동 로그인이 유지되도록 하는 보조 저장소) */
function getCookie(name) {
  try {
    const m = document.cookie.match(new RegExp("(?:^|; )" + name.replace(/([.$?*|{}()[\]\\/+^])/g, "\\$1") + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : null;
  } catch { return null; }
}
function setCookie(name, value, days = 365) {
  try {
    const d = new Date(); d.setTime(d.getTime() + days*24*60*60*1000);
    document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
  } catch {}
}
const store = {
  async get(k) {
    if (localOK) { try { const v = localStorage.getItem("alo:"+k); if (v !== null) return { value: v }; } catch {} }
    if (hasArt) { try { const r = await window.storage.get(k); if (r && r.value != null) return r; } catch {} }
    const c = getCookie("alo_"+k);
    if (c !== null) return { value: c };
    return k in mem ? { value: mem[k] } : null;
  },
  async set(k, v) {
    if (localOK) { try { localStorage.setItem("alo:"+k, v); } catch {} }
    if (hasArt) { try { await window.storage.set(k, v); } catch {} }
    setCookie("alo_"+k, v);
    mem[k] = v;
  },
};

function dayIndex(dateStr) {
  const [sy,sm,sd] = START_DATE.split("-").map(Number);
  const [y,m,d] = (dateStr || todayStr()).split("-").map(Number);
  const diff = Math.floor((new Date(y,m-1,d) - new Date(sy,sm-1,sd)) / 86400000) + 1;
  if (diff < 1) return 1;
  if (diff > DAILY_TOPICS.length) return ((diff-1) % DAILY_TOPICS.length) + 1;
  return diff;
}
const setOf = (dateStr) => DAILY_TOPICS[dayIndex(dateStr) - 1];
function hash(str) { let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);} return (h>>>0); }
function inPoly(x, y) {
  let ins = false;
  for (let i=0,j=BD_POLY.length-1;i<BD_POLY.length;j=i++) {
    const [xi,yi]=BD_POLY[i], [xj,yj]=BD_POLY[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) ins = !ins;
  }
  return ins;
}
function spotFor(id) {
  let h = hash(id);
  for (let k=0;k<200;k++) {
    h = Math.imul(h ^ (h>>>13), 1274126177) >>> 0;
    const x = 72 + (h % 700) / 10;        // 72~142
    const y = 16 + ((h>>>9) % 1050) / 10; // 16~121
    if (inPoly(x, y)) return { x, y };
  }
  return { x: 105, y: 62 };
}

// 구면 좌표 → 화면 좌표
function project(pt, ry, rx) {
  const cy1 = Math.cos(ry), sy1 = Math.sin(ry);
  let X = pt.x*cy1 + pt.z*sy1;
  let Z = -pt.x*sy1 + pt.z*cy1;
  const cx1 = Math.cos(rx), sx1 = Math.sin(rx);
  const Y = pt.y*cx1 - Z*sx1;
  Z = pt.y*sx1 + Z*cx1;
  const sc = SPH.FOV / (SPH.FOV + Z);
  return { sx: SPH.cx + X*sc, sy: SPH.cy + Y*sc, sc, z: Z };
}

function animateMap() {
  stopMap();
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const backG = document.getElementById("backG"), frontG = document.getElementById("frontG"),
        gC = document.getElementById("clines"), scene = document.getElementById("scene");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 구면 위 점 만들기 (피보나치 분포 + 해시로 고정 배치)
  const sphere = (i, total) => {
    const k = i + 0.5;
    const phi = Math.acos(1 - 2*k/total);
    const th = Math.PI * (1 + Math.sqrt(5)) * k;
    return { x: SPH.R*Math.sin(phi)*Math.cos(th), y: SPH.R*Math.cos(phi), z: SPH.R*Math.sin(phi)*Math.sin(th) };
  };

  // 배경 점(아직 밝혀지지 않은 자리) — 화면이 작은 모바일에서는 렉을 줄이기 위해 개수를 줄임
  const dimTotal = window.innerWidth < 480 ? 60 : 120;
  const dim = [];
  for (let i=0;i<dimTotal;i++) dim.push(sphere(i,dimTotal));

  // 기도 = 밝은 점
  const stars = entries.map(e => {
    const h = hash(e.id);
    const u = (h % 10000)/10000, v = ((h>>>13) % 10000)/10000;
    const phi = Math.acos(2*v - 1), th = 2*Math.PI*u;
    return { e, x: SPH.R*Math.sin(phi)*Math.cos(th), y: SPH.R*Math.cos(phi), z: SPH.R*Math.sin(phi)*Math.sin(th),
             ph: (h%628)/100 };
  });

  // 같은 사람 연결
  const byName = {};
  stars.forEach((s,i) => { (byName[s.e.name] = byName[s.e.name] || []).push(i); });
  const chains = Object.values(byName).filter(a => a.length > 1);
  gC.innerHTML = chains.map((_,i)=>`<path class="cline" id="mc${i}"/>`).join("");
  const cEls = chains.map((_,i)=>document.getElementById("mc"+i));
  // 닉네임 목록은 이제 구 위에 겹쳐 띄우지 않고, nickListHTML()이 구 아래 별도 목록으로 그려줌

  // 요소 생성
  const dimEls = dim.map(()=>{ const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("fill","#5b6478"); return c; });
  const starEls = stars.map(s => { const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","lt"+(selLight===s.e.id?" on":"")); g.dataset.id=s.e.id;
    g.innerHTML = `<circle class="lt-glow"/><use class="lt-spark" href="#spark"/><circle class="hit" fill="transparent"/>`;
    return g; });

  if (scene && !reduce) {
    // 구 위에 마우스를 대면, 대고 있는 쪽으로 구가 실제로 굴러가도록 —
    // (고정된 기울기가 아니라 대고 있는 동안 회전이 계속 누적됨) scene 요소에만 반응
    mapPointerHandler = (ev) => {
      const r = scene.getBoundingClientRect();
      hoverTX = Math.max(-1, Math.min(1, ((ev.clientX - r.left) / r.width - 0.5) * 2));
      hoverTY = Math.max(-1, Math.min(1, ((ev.clientY - r.top) / r.height - 0.5) * 2));
    };
    mapLeaveHandler = () => { hoverTX = 0; hoverTY = 0; };
    scene.addEventListener("pointermove", mapPointerHandler);
    scene.addEventListener("pointerleave", mapLeaveHandler);
  }

  let lastT = 0, frameN = 0;
  const tick = (t) => {
    const dt = lastT ? Math.min(48, t - lastT) : 16.7;
    lastT = t;
    curVX += (hoverTX - curVX) * 0.06;
    curTiltX += (hoverTY - curTiltX) * 0.06;
    // 평소엔 아주 천천히 자동으로 돌고, 마우스를 대고 있는 쪽으로는 회전 속도가 추가로 붙어서
    // 구가 그 방향으로 굴러가는 것처럼 보임 (커서가 가장자리에 가까울수록 더 빨리 구름)
    rollY += 0.000075*dt + curVX*0.0016*dt;
    const ry = rollY;
    const rx = -0.22 + curTiltX * 0.32;

    // 회전 계산은 매 프레임(60fps) 계속하되, 화면을 실제로 다시 그리는 무거운 작업은
    // 절반(약 30fps)만 해서 닉네임/기도가 많아도 모바일에서 렉이 덜 걸리게 함
    frameN++;
    if (frameN % 2 === 0) { mapRAF = requestAnimationFrame(tick); return; }

    const back = [], front = [];
    dim.forEach((d,i) => {
      const q = project(d, ry, rx);
      const el = dimEls[i];
      el.setAttribute("cx", q.sx.toFixed(1)); el.setAttribute("cy", q.sy.toFixed(1));
      el.setAttribute("r", (0.7 + q.sc*1.1).toFixed(2));
      el.setAttribute("opacity", (0.10 + (q.sc-0.72)*1.5).toFixed(2));
      (q.z > 0 ? back : front).push(el);
    });
    stars.forEach((s,i) => {
      const q = project(s, ry, rx);
      s.q = q;
      const on = selLight === s.e.id;
      const el = starEls[i];
      const r = (0.9 + q.sc*2.0) * (on?1.5:1);
      const vis = (q.sc - 0.68) * 2.6;
      const spin = (t*0.00009 + s.ph*3) * (180/Math.PI);
      el.setAttribute("transform", `translate(${q.sx.toFixed(2)} ${q.sy.toFixed(2)})`);
      el.children[0].setAttribute("r", (r*3.6).toFixed(1));
      el.children[0].setAttribute("opacity", ((on?.34:.15)*Math.max(0,vis)).toFixed(2));
      el.children[1].setAttribute("transform", `scale(${(r/5.2).toFixed(3)}) rotate(${spin.toFixed(1)})`);
      el.children[1].setAttribute("opacity",
        (Math.max(0.12, vis) * (0.78 + 0.22*Math.sin(t*0.0014 + s.ph))).toFixed(2));
      el.children[2].setAttribute("r", (r*4).toFixed(1));
      (q.z > 0 ? back : front).push(el);
    });
    backG.replaceChildren(...back);
    frontG.replaceChildren(...front);

    chains.forEach((idxs,i) => {
      const pts = idxs.map(id => stars[id].q);
      cEls[i].setAttribute("d", pts.map((q,k)=>`${k?"L":"M"}${q.sx.toFixed(1)},${q.sy.toFixed(1)}`).join(" "));
      const avg = pts.reduce((a,q)=>a+q.sc,0)/pts.length;
      cEls[i].setAttribute("opacity", Math.max(0, (avg-0.74)*3).toFixed(2));
    });

    mapRAF = requestAnimationFrame(tick);
  };
  tick(0);
  if (reduce) stopMap();

  starEls.forEach(g => { g.onclick = null; });
}

    </span>`).join("");

  let starEls = "", pathEls = "";
  paths.forEach((_,i)=> pathEls += `<path class="cline" id="cl${i}"/>`);
  stars.forEach((s,i)=> starEls += `<circle class="st ${s.lit?"lit":""}" id="s${i}" r="${s.r}"/>`);
  svg.innerHTML = `<defs><filter id="gl"><feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${pathEls}${starEls}`;

  const nodes = stars.map((_,i)=>document.getElementById("s"+i));
  const lines = paths.map((_,i)=>document.getElementById("cl"+i));

  const tick = (t) => {
    stars.forEach((s,i)=>{
      const dx = Math.sin(t*s.sp + s.ph) * s.ax;
      const dy = Math.cos(t*s.sp*0.8 + s.ph) * s.ay;
      s.cx = s.x + dx; s.cy = s.y + dy;
      const n = nodes[i];
      n.setAttribute("cx", s.cx.toFixed(1));
      n.setAttribute("cy", s.cy.toFixed(1));
      if (s.lit) n.setAttribute("opacity", (0.65 + 0.35*Math.sin(t*0.0012 + s.ph)).toFixed(2));
    });
    paths.forEach((pts,i)=>{
      const d = pts.map((idx,k)=>`${k?"L":"M"}${stars[idx].cx.toFixed(1)},${stars[idx].cy.toFixed(1)}`).join(" ");
      lines[i].setAttribute("d", d);
    });
    fieldRAF = requestAnimationFrame(tick);
  };
  if (reduce) { tick(0); stopField(); } else { fieldRAF = requestAnimationFrame(tick); }
}

function bindFlowInteractions(root = document) {
  root.querySelectorAll(".flow-item").forEach(el => {
    el.onclick = () => { flowSel = el.dataset.id; flowDone = null; render(); };
  });
  const flowBack = root.querySelector("#flowBack");
  if (flowBack) flowBack.onclick = () => { flowSel = null; flowDone = null; render(); };
  const bankCopy = root.querySelector("#bankCopy");
  if (bankCopy) {
    const bankCopyLabel = bankCopy.textContent;
    bankCopy.onclick = async () => {
      const acc = bankCopy.dataset.account || "";
      let ok = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(acc);
          ok = true;
        }
      } catch (e) { /* fall through to fallback */ }
      if (!ok) {
        try {
          const ta = document.createElement("textarea");
          ta.value = acc;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          ok = document.execCommand("copy");
          ta.remove();
        } catch (e) { ok = false; }
      }
      bankCopy.textContent = ok ? "복사됐어요!" : "복사 실패";
      bankCopy.classList.toggle("copied", ok);
      setTimeout(() => {
        bankCopy.textContent = bankCopyLabel;
        bankCopy.classList.remove("copied");
      }, 1600);
    };
  }
  const flowForm = root.querySelector("#flowForm");
  if (flowForm) {
    flowForm.onsubmit = async (e) => {
      e.preventDefault();
      const name = root.querySelector("#flowName").value.trim();
      const phone = root.querySelector("#flowPhone").value.trim();
      if (!name || !phone) return;
      const submitBtn = root.querySelector("#flowSubmit");
      submitBtn.disabled = true; submitBtn.textContent = "신청 중…";
      await submitFlow(flowSel, name, phone);
      flowDone = flowSel;
      render();
    };
  }
}

function bindPrayerTyping(target) {
  const tb = document.getElementById("tb"), dn = document.getElementById("dn"), tg = document.getElementById("tg");
  const amb = document.getElementById("ambient"), parts = document.getElementById("particles");
  const card = document.getElementById("prayCard");
  const pbarFill = document.getElementById("pbarFill"), typeWarn = document.getElementById("typeWarn");
  // 일부 키보드가 끝에 붙이는 보이지 않는 문자(제로폭 공백 등) 제거 + 일부 키보드가
  // 한글을 완성형(NFC) 대신 조합형(NFD)으로 내보내는 경우까지 정규화해서 비교
  const clean = (s) => s.normalize("NFC").replace(/[​‌‍﻿]/g, "").trimEnd();
  const lerp = (a,b,t)=>a+(b-a)*t;
  const mix = (c1,c2,t)=>`rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`;
  let lastLen = 0;
  let composing = false;

  const draw = () => {
    // 일부 키보드가 한글을 조합형(NFD)으로 내보내는 경우까지 대비해 항상 완성형(NFC)으로 정규화
    const v = tb.value.normalize("NFC");
    // 일부 키보드의 자동완성/예측 입력 기능이 커서보다 뒤에 텍스트를 미리 붙여넣는 경우가 있어서,
    // 실제 화면에 보이는 커서 위치(selectionStart)까지만 "확정된 입력"으로 간주하고 채점함
    // (커서 뒤에 붙은 예측 글자는 아직 사용자가 실제로 치지 않은 것이므로 미리 불이 켜지면 안 됨)
    const rawLen = typeof tb.selectionStart === "number" ? Math.min(v.length, tb.selectionStart) : v.length;
    // 조합 중에는 맨 마지막 한 글자만 아직 완성 전이라 정오 비교를 보류하고,
    // 그 앞의 글자들은 이미 확정된 글자이므로 실시간으로 바로 채점해서 보여줌
    const pendingIdx = composing ? rawLen - 1 : -1;
    let h = "";
    let hasTypo = false;
    for (let k=0;k<target.length;k++) {
      // 위 문장은 입력 내용과 무관하게 항상 원문(target[k])만 그대로 표시하고,
      // 색상(class)만 바뀐다 — 절대로 글자 내용 자체를 바꾸지 않음
      let c = "u";
      if (k < rawLen) {
        if (k === pendingIdx) {
          // 조합 중인 글자는 아직 확정 전이라 정오 판정은 보류(중립 커서 표시만)
          c = "cur";
        } else {
          c = (v[k] === target[k]) ? "ok" : "no";
          if (c === "no") hasTypo = true;
        }
      } else if (k === rawLen && !composing) {
        // 조합 중일 때는 위에서 이미 pendingIdx 자리에 커서를 표시했으므로
        // 여기서 또 표시하면 커서 두 개가 동시에 보이는 문제가 생김
        c = "cur";
      }
      // 스페이스가 커서 칸(cur, display:inline-block)에 걸리면 일부 브라우저가
      // 빈칸 너비를 접어버려 뒷글자가 앞으로 당겨지는 문제가 있어서 그 경우에만
      // 폭이 고정되는 &nbsp;로 대체함. 그 외의 일반 스페이스는 줄바꿈 지점으로
      // 계속 써야 하므로 그대로 둠 (전부 &nbsp;로 바꾸면 줄바꿈이 막혀 단어 중간에서
      // 억지로 줄이 꺾이는 문제가 생김)
      const chOut = (target[k] === " " && c === "cur") ? "&nbsp;" : esc(target[k]);
      h += `<span class="ch ${c}">${chOut}</span>`;
    }
    tg.innerHTML = h;

    // 빨간 글자만으로는 "오타"라는 걸 못 알아채는 사람들이 있어서 문구로도 알려줌
    // (조합 중인 마지막 글자는 hasTypo 판정에서 애초에 제외되므로 composing 여부와 무관하게 안전함)
    if (typeWarn) typeWarn.classList.toggle("show", hasTypo);

    const p = Math.min(1, rawLen / Math.max(1, target.length));
    if (pbarFill) pbarFill.style.width = (p * 100).toFixed(1) + "%";
    document.body.style.background = mix([8,9,11],[20,20,20],p);
    amb.style.background = `radial-gradient(circle at 50% 62%, rgba(255,198,120,${(p*0.14).toFixed(3)}), transparent 62%)`;
    card.style.borderColor = `rgba(217,163,85,${(0.16+p*0.42).toFixed(2)})`;
    card.style.boxShadow = `0 0 ${(p*54).toFixed(0)}px rgba(255,190,110,${(p*0.16).toFixed(2)}), 0 24px 80px rgba(0,0,0,.42)`;

    if (rawLen > lastLen && parts) {
      for (let k=0;k<2;k++) {
        const sp = document.createElement("span");
        sp.className = "pt";
        sp.style.left = (12+Math.random()*76)+"%";
        sp.style.bottom = (10+Math.random()*30)+"%";
        sp.style.animationDelay = (Math.random()*0.2).toFixed(2)+"s";
        parts.appendChild(sp);
        setTimeout(()=>sp.remove(), 3000);
      }
    }
    lastLen = rawLen;
    // 키보드가 문장 끝에 자동으로 붙이는 공백 때문에 완료 버튼이 안 눌리는 것을 방지
    dn.disabled = (clean(v) !== target);
  };
  tb.addEventListener("compositionstart", () => {
    composing = true;
    draw();
  });
  tb.addEventListener("compositionupdate", draw);
  tb.addEventListener("compositionend", () => {
    composing = false;
    // 일부 브라우저는 compositionend 시점에 value가 아직 최종 반영되기 전이라
    // 한 틱 미뤄서 다시 그린다 (오타로 오인되는 지연 현상 방지)
    setTimeout(draw, 0);
  });
  tb.oninput = draw;
  // 커서 위치만 바뀌는 경우(방향키, 클릭 등)도 확정 길이 계산에 영향을 주므로 다시 그림
  tb.addEventListener("keyup", draw);
  tb.addEventListener("click", draw);
  tb.addEventListener("select", draw);
  draw();

  dn.onclick = () => { if (clean(tb.value) === target) finish(); };

  const skipType = document.getElementById("skipType");
  if (skipType) {
    skipType.onclick = () => {
      tb.value = target;
      composing = false;
      draw();
      finish();
    };
  }
}

function startHold(btn) {
  if (holdT) return;
  holdT = setInterval(() => {
    holdP += 100/60;
    if (btn) btn.textContent = `기도하는 중… ${Math.min(100,Math.round(holdP))}%`;
    if (holdP >= 100) { cancelHold(); finish(); }
  }, 50);
}
function cancelHold() {
  if (holdT) { clearInterval(holdT); holdT = null; }
  holdP = 0;
  const b = document.getElementById("hd");
  if (b) b.textContent = "타이핑이 어려우면 · 3초 길게 눌러 기도";
}

/* ── 화면 4: 완료 ── */
async function finish() {
  const set = setOf();
  const en = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    name: nick, date: todayStr(), ts: Date.now(), day: set.day, topic: set.topic };
  try { entries = await addEntry(en); } catch { entries.push(en); }

  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div id="done">
    <div class="burst"></div>
    <div class="flame">🕯️</div>
    <div class="done-t">당신의 기도가<br>방글라데시의 작은 빛이 되었습니다</div>
    <div class="done-s">${esc(nick)} · ${new Date().getMonth()+1}월 ${new Date().getDate()}일</div>
    <button class="done-confirm" id="doneConfirm" type="button">확인</button>
  </div>`;
  document.getElementById("doneConfirm").onclick = () => {
    ov.innerHTML = ""; selLight = null;
    document.body.style.background = "";
    const amb = document.getElementById("ambient"); if (amb) amb.style.background = "";
    render();
    setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}), 60);
  };
}

/* ── 백업 ── */
function exportLog() {
  const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), entries }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `팀알로-기도의빛-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(a.href);
}
async function importLog(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const n = mergeInto(entries, parsed.entries || []);
    writeLocal(entries);
    if (fbOK) for (const e of entries) await pushRemote(e);
    alert(`${n}개의 빛을 불러왔어요. (전체 ${entries.length}개)`); render();
  } catch { alert("파일을 읽지 못했어요."); }
}

/* ── 라우팅 ── */
function render() { if (nickSet) { stopField(); viewHome(); } else { stopMap(); viewNick(); } }

(async () => {
  const r = await store.get("my-nick");
  if (r && r.value) { nick = r.value; nickSet = true; }
  entries = readLocal();
  render();
  entries = await syncAll();
  render();
  setInterval(async () => {
    if (document.getElementById("done")) return;
    const tb = document.getElementById("tb");
    if (tb && tb.value.length > 0) return;
    const before = entries.length;
    entries = await syncAll();
    if (entries.length !== before) render();
  }, 12000);
})();
</script>
