<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>방글라데시를 밝히는 기도 · TEAM ALO</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#05070e;color:#d8d2c4;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'맑은 고딕','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;
     padding:44px 20px 90px;transition:background 1.2s ease}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:2}
.brand{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.46em;color:#8a6a3a;margin-bottom:14px}
h1{text-align:center;font-size:22px;font-weight:600;letter-spacing:-.02em;color:#efe6d2;margin-bottom:10px;line-height:1.5}
.verse{text-align:center;font-size:12.5px;font-weight:400;color:#6c6455;margin-bottom:30px}
.lead{text-align:center;font-size:14px;font-weight:400;line-height:1.85;color:#9a927f;margin-bottom:28px}
.quiet{font-size:12px;font-weight:400;color:#6a6455;text-align:center}

/* 성좌 필드 (닉네임 화면) */
.field-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%}
.st{fill:#5a6170;opacity:.5}
.st.lit{fill:#ffd79a;filter:url(#gl)}
.cline{fill:none;stroke:rgba(255,255,255,.17);stroke-width:.75;stroke-dasharray:4 5}
.pill{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 7px;
  border-radius:99px;font-size:12.5px;font-weight:400;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.45);animation:drift 14s ease-in-out infinite}
.pill .pdot{width:16px;height:16px;border-radius:99px;display:block}
.p0{background:linear-gradient(135deg,#8a4520,#4a2413);color:#ffd9bf;border:1px solid rgba(255,150,80,.35)}
.p0 .pdot{background:#ff8a45}
.p1{background:linear-gradient(135deg,#6b3fd6,#3a1f7a);color:#e5d8ff;border:1px solid rgba(150,110,255,.4);animation-delay:-4s}
.p1 .pdot{background:#a97cff}
.p2{background:linear-gradient(135deg,#8a8256,#4a462c);color:#f3edd2;border:1px solid rgba(230,220,150,.35);animation-delay:-8s}
.p2 .pdot{background:#e8dfa0}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(9px,-7px)}66%{transform:translate(-7px,6px)}}

/* 닉네임 패널 */
.nick-panel{position:relative;z-index:3;min-height:calc(100vh - 130px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.nick-h{font-size:29px;font-weight:300;line-height:1.45;color:#f2e9d5;margin-bottom:16px;letter-spacing:-.01em}
.nick-lead{font-size:14px;font-weight:300;line-height:1.85;color:#948c79;margin-bottom:34px}
.nick-box{width:100%;max-width:330px;display:flex;flex-direction:column;gap:9px}
.nick-box input{text-align:center;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);padding:15px}
.nick-box button{width:100%;padding:15px}

/* 배경 별 */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#ambient{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background .45s ease,opacity .45s ease}
#sky i{position:absolute;width:2px;height:2px;border-radius:99px;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}}

/* 입력 */
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:18px;
  padding:14px 16px;color:#f4ecd8;font-size:15px;font-family:inherit;font-weight:400}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.26)}
input:focus,textarea:focus{outline:none;border-color:#d9a355;box-shadow:0 0 0 3px rgba(217,163,85,.13)}
button{background:transparent;color:#e8c48a;border:1px solid rgba(217,163,85,.5);border-radius:9999px;padding:13px 22px;
  font-size:14px;font-weight:400;font-family:inherit;cursor:pointer;transition:all .2s}
button:hover{background:rgba(217,163,85,.1)}
button:active{transform:scale(.95)}
button.solid{background:#d9a355;border-color:#d9a355;color:#20160a;font-weight:600}
button.solid:hover{background:#e8b872}
button:disabled{border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.24);cursor:default;background:transparent}
button.plain{border:none;color:#6a6455;font-size:12.5px;font-weight:400;padding:8px}
button.plain:hover{background:none;color:#9a927f}

/* 지도 */
.scene{position:relative;width:100vw;margin-left:calc(50% - 50vw);perspective:900px;
  perspective-origin:50% 45%;margin-bottom:2px}
.map-shell{position:relative;width:100%;max-width:700px;margin:0 auto;
  transform-style:preserve-3d;transition:transform .08s linear;will-change:transform}
.map-svg{width:100%;display:block;overflow:visible}
.sea{fill:#080d18}
.nbr{fill:#0e1420}
.land{transition:fill 1.4s ease}
.halo{transition:opacity 1.4s ease}
.lt{cursor:pointer}
.lt-name{fill:#d98a78;opacity:.62;font-weight:400;pointer-events:none;transition:opacity .2s,fill .2s}
.lt:hover .lt-name{opacity:1;fill:#ffb199}
.lt.on .lt-name{opacity:1;fill:#ffb199;font-weight:600}
.lt-glow{fill:#c62d1f}
.lt-spark{fill:#ff6b52;filter:url(#glow)}
.map-shell{position:relative}
#pillLayer{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.mpill{position:absolute;pointer-events:auto;cursor:pointer;font-size:11.5px;padding:4px 12px 4px 4px;
  transform-origin:center;transition:filter .2s;backdrop-filter:blur(3px)}
.mpill:hover{filter:brightness(1.25)}
.mpill .pdot{width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:rgba(0,0,0,.62)}
.mpill.big{font-size:12.5px;padding:5px 13px 5px 5px}
.mpill.big .pdot{width:18px;height:18px;font-size:10px}
.t0{background:linear-gradient(135deg,#8a4520,#4a2413);color:#ffd9bf;border:1px solid rgba(255,150,80,.4)}
.t0 .pdot{background:#ff8a45}
.t1{background:linear-gradient(135deg,#6b3fd6,#3a1f7a);color:#e5d8ff;border:1px solid rgba(150,110,255,.42)}
.t1 .pdot{background:#a97cff}
.t2{background:linear-gradient(135deg,#8a8256,#4a462c);color:#f3edd2;border:1px solid rgba(230,220,150,.38)}
.t2 .pdot{background:#e8dfa0}
.map-cap{text-align:center;font-size:12px;font-weight:400;color:#7a7362;margin-top:6px;letter-spacing:.03em}
.map-cap b{color:#e8c48a;font-weight:600}

/* 빛 정보 */
.tip{background:rgba(255,255,255,.045);border:1px solid rgba(217,163,85,.28);border-radius:18px;padding:15px 17px;margin-top:14px}
.tip-n{font-size:15px;color:#f4ecd8;font-weight:600}
.tip-n span{font-size:11.5px;color:#8a8270;font-weight:400;margin-left:8px}
.tip-t{font-size:13px;font-weight:400;line-height:1.75;color:#a49b86;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07)}

/* 카드 */
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;margin-bottom:14px}
.day-tag{font-size:10.5px;font-weight:600;letter-spacing:.24em;color:#8a6a3a;margin-bottom:12px}
.topic{font-size:16px;font-weight:400;line-height:1.95;color:#e9e0cc;word-break:keep-all}
.today-who{font-size:12px;font-weight:400;color:#7a7362;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);line-height:1.7}
.today-who b{color:#c9a978;font-weight:600}

/* 타이핑 */
.target{font-size:16px;line-height:2.05;font-weight:400;word-break:keep-all;margin:2px 0 16px}
.ch{transition:color .35s,text-shadow .35s}
.ch.u{color:rgba(255,255,255,.17)}
.ch.ok{color:#fff3d6;text-shadow:0 0 9px rgba(255,206,133,.85),0 0 20px rgba(255,168,74,.4)}
.ch.no{color:#ff8f6d;border-bottom:1px solid #ff8f6d}
.ch.cur{color:rgba(255,255,255,.32);border-bottom:2px solid #d9a355}
#tb{min-height:92px;line-height:1.9;resize:none}
.pbar{height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d5326,#d9a355,#ffe2ae);transition:width .25s ease}
.pcap{text-align:center;font-size:12px;font-weight:400;color:#8a8270;margin-top:10px;transition:color .5s}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.card{position:relative;transition:border-color .45s ease,box-shadow .45s ease}
.pt{position:absolute;width:3px;height:3px;border-radius:99px;background:#ffd79a;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}
  18%{opacity:.9}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}

/* 바텀시트 */
.sheet-overlay{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.56);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fi .18s both}
.bottom-sheet{position:relative;width:100%;max-width:560px;max-height:88svh;overflow-y:auto;
  border:1px solid rgba(255,255,255,.11);border-bottom:0;border-radius:30px 30px 0 0;
  background:linear-gradient(180deg,#111722 0%,#090d15 100%);padding:10px 22px max(24px,env(safe-area-inset-bottom));
  box-shadow:0 -26px 72px rgba(0,0,0,.5);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both;
  transition:border-color .45s ease,box-shadow .45s ease}
.sheet-head{margin-bottom:18px}
.sheet-title{font-size:20px;font-weight:700;line-height:1.35;color:#f4ecd8;letter-spacing:0}
.sheet-actions{margin-top:16px}
.sheet-actions .solid{width:100%;min-height:54px}
@keyframes sheetUp{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:none}}

/* 완료 */
#done{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 22px;background:#0a0d16;cursor:pointer;overflow:hidden}
.burst{position:absolute;left:50%;top:44%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:99px;
  background:radial-gradient(circle,rgba(255,224,160,.95),rgba(255,180,90,.35) 45%,transparent 70%);animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  25%{opacity:1}100%{transform:translate(-50%,-50%) scale(46);opacity:0}}
.flame{font-size:38px;animation:pop .7s cubic-bezier(.2,1.8,.4,1) both;filter:drop-shadow(0 0 22px rgba(255,190,110,.75))}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.done-t{font-size:19px;font-weight:400;color:#f4ecd8;margin-top:24px;text-align:center;line-height:1.7;animation:fi .9s .3s both}
.done-s{font-size:13px;font-weight:400;color:#8a8270;margin-top:14px;text-align:center;animation:fi .9s .55s both}
.done-tap{font-size:11.5px;font-weight:400;color:#4f4b40;margin-top:40px;animation:fi .9s 1.2s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 팀원 */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px}
.mem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 3px;border-radius:11px;cursor:pointer;
  border:1px solid transparent;transition:background .16s}
.mem:hover,.mem.open{background:rgba(255,255,255,.05);border-color:rgba(217,163,85,.3)}
.av{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:rgba(217,163,85,.13);color:#c9a978;font-size:15px;font-weight:600;object-fit:cover}
.mem-n{font-size:11.5px;color:#c8c0ad;font-weight:400}
.mem-r{font-size:9.5px;color:#6a6455;font-weight:400}
.mem-d{margin-top:14px;padding:15px;background:rgba(217,163,85,.06);border:1px solid rgba(217,163,85,.2);border-radius:18px}
.mem-d h4{font-size:14px;font-weight:600;color:#f4ecd8;margin-bottom:10px}
.mem-d h4 span{font-size:11px;color:#8a6a3a;font-weight:400;margin-left:6px}
.mem-d ul{padding-left:15px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:400;line-height:1.75;color:#a49b86}
.mem-d li::marker{color:#8a6a3a}

.sec{font-size:10.5px;font-weight:600;letter-spacing:.26em;color:#6a6455;text-align:center;margin:38px 0 14px}
.foot{display:flex;justify-content:center;gap:16px;margin-top:26px;flex-wrap:wrap}
.note{text-align:center;font-size:11px;font-weight:400;color:#4f4b40;margin-top:12px}
.hide{display:none}

/* 상단 GNB (탭 전환형) */
.topbar{position:sticky;top:0;z-index:15;width:100vw;margin-left:calc(50% - 50vw);
  padding:10px 0 14px;margin-bottom:14px;
  background:linear-gradient(180deg,#05070e 72%,rgba(5,7,14,.9) 88%,rgba(5,7,14,0));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar-inner{max-width:560px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.topbar-brand{font-size:10.5px;font-weight:600;letter-spacing:.46em;color:#8a6a3a;text-align:center}
.topbar-tabs{width:100%;display:flex;gap:8px;overflow-x:auto;padding:0 2px 4px;justify-content:center;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.topbar-tabs::-webkit-scrollbar{display:none}
.topbar-tab{flex:0 0 auto;background:transparent;border:0;color:#7d7668;
  border-radius:9999px;padding:9px 15px;font-size:12.5px;font-weight:600;font-family:inherit;white-space:nowrap;
  cursor:pointer;transition:background .18s,color .18s,transform .18s,box-shadow .18s}
.topbar-tab:hover{background:rgba(255,255,255,.07);color:#d6cfbf}
.topbar-tab.on{background:rgba(255,255,255,.13);color:#f4ecd8;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.topbar-tab:active{transform:scale(.95)}
@media(max-width:430px){.topbar-tabs{justify-content:flex-start}}
.info-panel{margin-top:12px}
.info-panel .gnb-title{margin-bottom:18px}

/* 홈 */
.home-screen{min-height:calc(100svh - 122px);display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:12px 0 max(14px,env(safe-area-inset-bottom))}
.home-copy{width:100%;padding-top:10px}
.home-subtitle{font-size:15px;font-weight:500;line-height:1.6;color:#8f8878;margin-bottom:8px}
.home-title{font-size:clamp(28px,8vw,38px);font-weight:700;line-height:1.28;color:#f4ecd8;
  letter-spacing:0;margin:0 auto;text-align:center;word-break:keep-all}
.home-orb{width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:320px;padding:16px 0 10px}
.home-orb .scene{margin-top:-8px}
.home-orb .map-cap{margin-top:-10px}
.home-cta{width:100%;margin-top:auto;padding-top:14px}
.cta-main{width:100%;min-height:62px;border:0;border-radius:20px;background:#f4ecd8;color:#080b12;
  font-size:17px;font-weight:700;box-shadow:0 18px 42px rgba(0,0,0,.34)}
.cta-main:hover{background:#f4ecd8;color:#080b12}
.cta-note{font-size:12.5px;font-weight:500;color:#6f685b;margin-top:14px;text-align:center}

.gnb-title{font-size:11px;font-weight:600;letter-spacing:.22em;color:#8a6a3a;margin-bottom:14px}
.gnb-text{font-size:14px;font-weight:400;line-height:1.95;color:#c8c0ad;word-break:keep-all;white-space:pre-line}
.gnb-bank{margin-top:18px;background:rgba(217,163,85,.08);border:1px solid rgba(217,163,85,.25);border-radius:18px;
  padding:15px 16px;font-size:13.5px;color:#f4ecd8;font-weight:400;text-align:center;letter-spacing:.02em}
.gnb-link{display:block;margin-top:12px;text-align:center;font-size:13px;color:#e8c48a;font-weight:400;
  text-decoration:none;border:1px solid rgba(217,163,85,.4);border-radius:9999px;padding:13px 16px;word-break:break-all;transition:background .18s}
.gnb-link:hover{background:rgba(217,163,85,.1)}
.gnb-link:active{transform:scale(.95)}

/* 플로잉(품목 후원) 메뉴판 */
.flow-group-title{font-size:10.5px;font-weight:600;letter-spacing:.22em;color:#8a6a3a;margin:22px 0 8px}
.flow-list{border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden}
.flow-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:transparent;border:0;border-top:1px solid rgba(255,255,255,.07);border-radius:0;
  padding:13px 16px;font-size:13px;font-weight:400;color:#e9e0cc;text-align:left;font-family:inherit;cursor:pointer;transition:background .15s}
.flow-list .flow-item:first-child{border-top:0}
.flow-item:hover{background:rgba(217,163,85,.08)}
.flow-item-n{flex:1;line-height:1.5;word-break:keep-all}
.flow-count{display:block;font-size:11px;font-weight:400;color:#8a6a3a;margin-top:3px}
.flow-item-p{flex:0 0 auto;font-size:12.5px;font-weight:600;color:#e8c48a;white-space:nowrap}
.flow-form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.flow-form-item{font-size:13.5px;font-weight:600;color:#f4ecd8;text-align:right;word-break:keep-all}
.flow-form-item span{display:block;font-size:12px;font-weight:400;color:#e8c48a;margin-top:2px}
#flowForm{display:grid;gap:8px}
.flow-thanks{text-align:center;padding:20px 0}
.flow-thanks-t{font-size:16px;font-weight:600;color:#f4ecd8;margin-bottom:10px}
.flow-thanks-s{font-size:13px;font-weight:400;color:#a49b86;line-height:1.7;margin-bottom:18px}

/* 닉네임 화면 (gradient orb 디자인, 모바일 퍼스트 · 풀블리드) */
.app-shell{min-height:100svh;width:100vw;margin-left:calc(50% - 50vw);display:grid;place-items:center;padding:0}
.welcome-screen{position:relative;width:100%;min-height:100svh;
  overflow:hidden;isolation:isolate;display:grid;grid-template-rows:auto 1fr auto;gap:30px;
  padding:max(30px,env(safe-area-inset-top)) 24px max(26px,env(safe-area-inset-bottom));
  border:0;border-radius:0;
  background:radial-gradient(circle at 50% 36%, rgba(255,55,89,.13), transparent 32%),
    radial-gradient(circle at 50% 72%, rgba(25,99,75,.18), transparent 38%),
    linear-gradient(180deg,#050706 0%,#06140f 50%,#010403 100%)}
.welcome-stars{position:absolute;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.welcome-stars i{position:absolute;width:2px;height:2px;border-radius:99px;background:#fff;animation:tw 4s ease-in-out infinite}
.welcome-screen .ambient{position:absolute;z-index:-1;width:280px;height:280px;filter:blur(92px);opacity:.26;pointer-events:none}
.welcome-screen .ambient-top{top:110px;left:50%;transform:translateX(-50%);background:#d92c55}
.welcome-screen .ambient-bottom{right:-110px;bottom:120px;background:#0f6a52}
.welcome-screen .hero-copy{padding-top:clamp(30px,8.5svh,60px);text-align:center}
.welcome-screen .event-date{margin:0 0 12px;color:rgba(245,245,247,.62);font-size:11px;font-weight:600;
  letter-spacing:.36em;text-transform:uppercase}
.welcome-screen h1{max-width:360px;margin:0 auto;font-size:clamp(22px,9.2vw,30px);font-weight:600;
  line-height:1.25;letter-spacing:-.02em;text-wrap:balance;text-align:center;color:#f5f5f7}
.welcome-count-pill{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:20px auto 0;
  padding:11px 24px;border-radius:9999px;background:rgba(255,255,255,.2);color:#2f3540;
  font-size:13px;font-weight:600;line-height:1.45;box-shadow:0 12px 36px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.44);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.welcome-count-pill b{font-weight:800;color:#202633}
.dream-stage{position:relative;align-self:center;justify-self:center;width:min(58vw,220px);aspect-ratio:1;
  display:grid;place-items:center}
.gradient-orb{position:relative;width:100%;height:100%;overflow:hidden;border-radius:50%;background:#9d1037;
  border:1px solid rgba(255,232,236,.26);
  box-shadow:0 0 0 .5px rgba(255,255,255,.26), inset 16px 16px 44px rgba(255,238,232,.38), inset -30px -24px 54px rgba(52,0,20,.54)}
.gradient-orb::before,.gradient-orb::after{content:"";position:absolute;border-radius:inherit}
.gradient-orb::before{inset:-24%;
  background:radial-gradient(circle at 27% 48%, rgba(255,185,129,.95) 0 15%, transparent 38%),
    radial-gradient(circle at 74% 46%, rgba(130,2,41,.94) 0 18%, transparent 44%),
    radial-gradient(circle at 46% 72%, rgba(255,48,68,.9) 0 17%, transparent 41%),
    radial-gradient(circle at 56% 24%, rgba(255,134,130,.82) 0 16%, transparent 42%),
    radial-gradient(circle at 24% 25%, rgba(255,219,202,.7) 0 12%, transparent 35%),
    conic-gradient(from 20deg at 50% 50%, #ffb4a8, #d81945, #74001f, #ff553f, #be0b3d, #ffc0b8);
  filter:blur(13px) saturate(1.25);transform:translate3d(-2%,1%,0) rotate(0deg) scale(1.08);
  animation:orbGradientFlow 9200ms ease-in-out infinite}
.gradient-orb::after{inset:0;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.52), transparent 28%),
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(255,217,209,.35) 100%);
  mix-blend-mode:screen;opacity:.64;animation:orbSurfaceShift 6800ms ease-in-out infinite}
.nickname-form{position:relative;align-self:end;display:grid;gap:10px;padding-bottom:76px}
.input-wrap{position:relative}
.welcome-screen input{width:100%;height:56px;border:1px solid rgba(255,255,255,.14);border-radius:9999px;
  background:rgba(255,255,255,.07);color:#f5f5f7;outline:none;padding:0 48px 0 20px;font-size:16px;font-weight:400;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:border-color 180ms ease, background-color 180ms ease}
.welcome-screen input::placeholder{color:rgba(245,245,247,.42)}
.welcome-screen input:focus{border-color:rgba(255,255,255,.72);background:rgba(255,255,255,.12);box-shadow:none}
.clear-button{position:absolute;top:50%;right:11px;width:34px;height:34px;padding:0;border:0;border-radius:50%;
  background:transparent;opacity:0;transform:translateY(-50%) scale(.92);pointer-events:none;
  transition:opacity 160ms ease, transform 160ms ease, background-color 160ms ease}
.clear-button span,.clear-button span::after{position:absolute;left:50%;top:50%;width:14px;height:2px;
  border-radius:999px;background:rgba(248,244,240,.76);content:""}
.clear-button span{transform:translate(-50%,-50%) rotate(45deg)}
.clear-button span::after{transform:translate(-50%,-50%) rotate(90deg)}
.clear-button:active{transform:translateY(-50%) scale(.95)}
.input-wrap.has-value .clear-button{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.primary-button{position:fixed;left:20px;right:20px;bottom:max(20px,env(safe-area-inset-bottom));z-index:20;
  width:auto;min-height:56px;border:0;border-radius:9999px;font-size:17px;font-weight:400;
  font-family:inherit;cursor:pointer;color:#031611;background:#ffffff;
  box-shadow:0 14px 34px rgba(0,0,0,.4);
  transition:transform .15s ease, box-shadow .2s ease}
.primary-button:hover{background:#ffffff}
.primary-button:active{transform:scale(.95)}
.primary-button:disabled{color:rgba(17,17,17,.42);background:rgba(255,255,255,.5);cursor:default;box-shadow:none}
.welcome-screen .quiet{color:rgba(245,245,247,.5)}
.welcome-screen .quiet b{color:#f5f5f7}
@keyframes orbGradientFlow{
  0%{transform:translate3d(-3%,1%,0) rotate(0deg) scale(1.08)}
  35%{transform:translate3d(4%,-5%,0) rotate(84deg) scale(1.13)}
  70%{transform:translate3d(-2%,5%,0) rotate(190deg) scale(1.1)}
  100%{transform:translate3d(-3%,1%,0) rotate(360deg) scale(1.08)}
}
@keyframes orbSurfaceShift{
  0%,100%{opacity:.64;transform:rotate(-5deg) scale(1)}
  50%{opacity:.82;transform:rotate(7deg) scale(1.04)}
}
@media(max-height:720px){
  .welcome-screen{gap:16px}
  .welcome-screen .hero-copy{padding-top:18px}
  .dream-stage{width:min(50vw,190px)}
}
@media(prefers-reduced-motion:reduce){#sky i,.welcome-stars i,.pt,.burst,.flame,.done-t,.done-s,.done-tap,.gradient-orb::before,.gradient-orb::after{animation:none}}
</style>

  { name:"이지행", role:"무언극 리더", photo:"", prays:["국내 아웃리치 팀장 사역과 방글라데시 아웃리치 참여를 동시에 준비하게 되었는데, 많은 에너지가 필요한 시기인 만큼 지치지 않고 모든 과정을 오직 기도로 든든히 쌓아가며 준비할 수 있게 되도록","최근 순장 섬김으로 인해 마음이 많이 소진되고 사역이 '일'처럼 느껴지는데, 이번 아웃리치를 통해 하나님의 사랑을 먼저 마음껏 누리도록","하나님께 가득 채움 받은 사랑을 바탕으로 방글라데시 땅의 현지 영혼들과 선교사님 가정, 그리고 함께 가는 팀원들에게 그 사랑을 넉넉하게 흘려보내는 축복의 통로가 되도록"] },
  { name:"이태영", role:"타임키퍼 리더", photo:"", prays:["하나님께서 방글라데시로 부르신 뜻을 깊이 깨닫고, 그 땅에 예수님의 사랑을 온전히 흘려보내고 올 수 있도록","방글라데시에서 다치는 일 없이 건강하게 사역하며, 팀원들과 성령 안에서 끈끈하게 하나가 되어 깊은 교제를 나누도록","사역과 팀과 팀원을 위해 끝까지 뜨겁게 중보하며, 기도의 자리를 놓치지 않도록","연차 승인이 되어 방글라데시 꼭 갈 수 있도록!"] },

  { name:"하동석", role:"프로그램 리더", photo:"", prays:["예수님의 성품을 깊이 닮아가는 성화의 삶을 살며, 고린도전서에 나오는 사랑의 속성들이 인격과 삶 속에 풍성히 배어 나오도록","다락방 공동체 관계 가운데 지혜를 구하고, 주보팀 사역과 함께 맡겨진 모든 역할을 기쁨과 감사함으로 균형 있게 감당해 내도록","우여곡절 끝에 가게된 방글라데시 아웃리치 여정 가운데 안전하게 동행하여 주시고, 그 현장에서 세밀하게 말씀하시는 하나님의 음성을 깊이 듣고 돌아오도록"] },
  { name:"염길현", role:"프로그램 부리더", photo:"", prays:["아웃리치 가기 전까지 '나의 하나님'이 더욱 분명해지고 하나님의 사랑을 깊이 깨달아, 현지 영혼들에게 그 사랑을 온전히 전할 수 있기를","온전히 하나님의 시선으로 나를 바라보며 사람들의 시선에서 자유해지고, 하나님의 시선으로 다른 사람들도 바라볼 수 있도록","아웃리치 모든 기간 동안 통증이나 아픔으로 인해 방해받지 않도록 영육을 지켜주시고, 온전히 사역에 집중할 수 있도록","모든 일정 속에서 마음과 생각을 지키고 부어주시는 은혜를 온전히 누릴 수 있도록"] },
  { name:"김용지", role:"중보기도 리더", photo:"", prays:["아내의 영육 간의 강건함과 회복, 부부의 영적 연합을 통해 하나님이 기뻐하시는 가정 이루도록","내 힘을 의지하던 모습을 내려놓고, 오직 기도함으로 주님을 전적으로 신뢰하고 의지하도록","어떤 상황이나 일을 마주하더라도 마음속에 감사와 기쁨으로 가득하도록","국내, 해외 아웃리치 기대와 기도로 준비하도록"] },
  { name:"신정금", role:"블레싱 리더", photo:"", prays:["남편의 담낭에 담석 여러 개와 용종들이 있는데 더 안 커지도록, 건강이 회복되도록","6월에 몰려 있는 마리아 행전, 티셔츠 판매, 카운트다운, 재정 마감 등 바쁜 사역 일정들을 끝까지 잘 마무리할 수 있도록","아웃리치 기쁜 마음으로 기도하는 마음으로 잘 섬기도록"] },
  { name:"김소연", role:"메딕", photo:"", prays:["평소 체력이 많이 약한 편인데 고온다습한 방글라데시 현지 기후 속에서도 지치지 않고, 아웃리치 일정을 건강하게 모두 소화하고 무사히 돌아올 수 있도록","요즘 들어 기도가 잘 안 되고 세상적인 것들에 눈이 가면서 신앙의 정체기를 겪고 있는데, 내 힘과 노력이 아닌 성령 충만함을 입어 기쁘게 믿음 생활을 이어갈 수 있도록","하나님께서 예비하신 가장 귀한 사랑을 담기 위해 제 그릇을 더 넓혀주셔서 준비된 사람이 될 수 있게 해주시고 그 배우자와 함께 하나님의 뜻을 이뤄나갈 수 있길"] },
  { name:"박수진", role:"특순 리더", photo:"", prays:["방글라데시 아웃리치에 대한 그 부르심의 이유를 명확히 깨닫고 그곳에서 일하시는 하나님을 깊이 경험하도록","낯설고 열악한 현지 환경 속에서도 사역 기간 내내 건강과 안전을 온전히 지켜주시도록","아웃리치를 준비하는 모든 과정 속에서 감사의 마음이 넘치게 하시고, 하나님 주관 아래 잘 준비해서 무사히 다녀오도록"] },

const LOCAL_KEY = "alo:prayer-log-v1";
const mem = {};

function readLocal() {
  if (localOK) { try { const v = localStorage.getItem(LOCAL_KEY); if (v) return JSON.parse(v).entries || []; } catch {} }
  try { return JSON.parse(mem[LOCAL_KEY] || "{}").entries || []; } catch { return []; }
}
function writeLocal(list) {
  const j = JSON.stringify({ entries: list });
  if (localOK) { try { localStorage.setItem(LOCAL_KEY, j); } catch {} }
  mem[LOCAL_KEY] = j;
}
function mergeInto(base, incoming) {
  const seen = new Set(base.map(e => e.id));
  let n = 0;
  (incoming || []).forEach(e => { if (e && e.id && !seen.has(e.id)) { base.push(e); seen.add(e.id); n++; } });
  base.sort((a,b) => (a.ts||0) - (b.ts||0));
  return n;
}
async function fetchRemote() {
  if (!fbOK) return [];
  try {
    const r = await fetch(FB + "/prayers.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    return d ? Object.values(d).filter(e => e && e.id) : [];
  } catch (err) { fbOK = false; console.warn("공용 서버 연결 실패", err); return []; }
}
async function pushRemote(en) {
  if (!fbOK) return false;

  const remote = await fetchRemote();

  mergeInto(all, remote);

    const rid = new Set(remote.map(e => e.id));
    for (const e of local) if (!rid.has(e.id)) await pushRemote(e);

      if (r) mergeInto(all, JSON.parse(r.value).entries || []);
      await window.storage.set("prayer-log-v1", JSON.stringify({ entries: all }), true);
    } catch {}
  }
  writeLocal(all);
  return all;

function dayIndex(dateStr) {
  const [sy,sm,sd] = START_DATE.split("-").map(Number);
  const [y,m,d] = (dateStr || todayStr()).split("-").map(Number);
  const diff = Math.floor((new Date(y,m-1,d) - new Date(sy,sm-1,sd)) / 86400000) + 1;
  if (diff < 1) return 1;
  if (diff > DAILY_TOPICS.length) return ((diff-1) % DAILY_TOPICS.length) + 1;
  return diff;
}
const setOf = (dateStr) => DAILY_TOPICS[dayIndex(dateStr) - 1];
function hash(str) { let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);} return (h>>>0); }
function inPoly(x, y) {
  let ins = false;
  for (let i=0,j=BD_POLY.length-1;i<BD_POLY.length;j=i++) {
    const [xi,yi]=BD_POLY[i], [xj,yj]=BD_POLY[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) ins = !ins;
  }
  return ins;
}
function spotFor(id) {
  let h = hash(id);
  for (let k=0;k<200;k++) {
    h = Math.imul(h ^ (h>>>13), 1274126177) >>> 0;
    const x = 72 + (h % 700) / 10;        // 72~142
    const y = 16 + ((h>>>9) % 1050) / 10; // 16~121
    if (inPoly(x, y)) return { x, y };
  }
  return { x: 105, y: 62 };
}

// 구면 좌표 → 화면 좌표
function project(pt, ry, rx) {
  const cy1 = Math.cos(ry), sy1 = Math.sin(ry);
  let X = pt.x*cy1 + pt.z*sy1;
  let Z = -pt.x*sy1 + pt.z*cy1;
  const cx1 = Math.cos(rx), sx1 = Math.sin(rx);
  const Y = pt.y*cx1 - Z*sx1;
  Z = pt.y*sx1 + Z*cx1;
  const sc = SPH.FOV / (SPH.FOV + Z);
  return { sx: SPH.cx + X*sc, sy: SPH.cy + Y*sc, sc, z: Z };
}

function animateMap() {
  stopMap();
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const backG = document.getElementById("backG"), frontG = document.getElementById("frontG"),
        gC = document.getElementById("clines"), pl = document.getElementById("pillLayer"),
        scene = document.getElementById("scene");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 구면 위 점 만들기 (피보나치 분포 + 해시로 고정 배치)
  const sphere = (i, total) => {
    const k = i + 0.5;
    const phi = Math.acos(1 - 2*k/total);
    const th = Math.PI * (1 + Math.sqrt(5)) * k;
    return { x: SPH.R*Math.sin(phi)*Math.cos(th), y: SPH.R*Math.cos(phi), z: SPH.R*Math.sin(phi)*Math.sin(th) };
  };

  // 배경 점(아직 밝혀지지 않은 자리)
  const dim = [];
  for (let i=0;i<120;i++) dim.push(sphere(i,120));

  // 기도 = 밝은 점
  const stars = entries.map(e => {
    const h = hash(e.id);
    const u = (h % 10000)/10000, v = ((h>>>13) % 10000)/10000;
    const phi = Math.acos(2*v - 1), th = 2*Math.PI*u;
    return { e, x: SPH.R*Math.sin(phi)*Math.cos(th), y: SPH.R*Math.cos(phi), z: SPH.R*Math.sin(phi)*Math.sin(th),
             ph: (h%628)/100 };
  });

  // 같은 사람 연결
  const byName = {};
  stars.forEach((s,i) => { (byName[s.e.name] = byName[s.e.name] || []).push(i); });
  const chains = Object.values(byName).filter(a => a.length > 1);
  gC.innerHTML = chains.map((_,i)=>`<path class="cline" id="mc${i}"/>`).join("");
  const cEls = chains.map((_,i)=>document.getElementById("mc"+i));

  // 닉네임 알약
  const counts = Object.entries(byName).map(([nm,arr]) => ({ nm, c: arr.length, i: arr[arr.length-1] }))
    .sort((a,b) => b.c - a.c).slice(0, 7);
  const TONE = ["t0","t1","t2"];
  pl.innerHTML = counts.map((p,k) => `<span class="pill mpill ${TONE[k%3]} ${p.c>=3?"big":""}"
      data-nm="${esc(p.nm)}"><i class="pdot">${p.c}</i>${esc(p.nm)}</span>`).join("");
  const pEls = [...pl.children];

  // 요소 생성
  const dimEls = dim.map(()=>{ const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("fill","#5b6478"); return c; });
  const starEls = stars.map(s => { const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","lt"+(selLight===s.e.id?" on":"")); g.dataset.id=s.e.id;
    g.innerHTML = `<circle class="lt-glow"/><use class="lt-spark" href="#spark"/><circle class="hit" fill="transparent"/>`;
    return g; });

  if (scene && !reduce) {
    scene.onpointermove = (ev) => {
      const r = scene.getBoundingClientRect();
      tilt.tx = ((ev.clientX - r.left)/r.width - 0.5) * 2;
      tilt.ty = ((ev.clientY - r.top)/r.height - 0.5) * 2;
    };
    scene.onpointerleave = () => { tilt.tx = 0; tilt.ty = 0; };
  }

  const tick = (t) => {
    tilt.x += (tilt.tx - tilt.x) * 0.05;
    tilt.y += (tilt.ty - tilt.y) * 0.05;
    const ry = t * 0.000075 + tilt.x * 0.5;
    const rx = -0.22 + tilt.y * 0.32;

    const back = [], front = [];
    dim.forEach((d,i) => {
      const q = project(d, ry, rx);
      const el = dimEls[i];
      el.setAttribute("cx", q.sx.toFixed(1)); el.setAttribute("cy", q.sy.toFixed(1));
      el.setAttribute("r", (0.7 + q.sc*1.1).toFixed(2));
      el.setAttribute("opacity", (0.10 + (q.sc-0.72)*1.5).toFixed(2));
      (q.z > 0 ? back : front).push(el);
    });
    stars.forEach((s,i) => {
      const q = project(s, ry, rx);
      s.q = q;
      const on = selLight === s.e.id;
      const el = starEls[i];
      const r = (0.9 + q.sc*2.0) * (on?1.5:1);
      const vis = (q.sc - 0.68) * 2.6;
      const spin = (t*0.00009 + s.ph*3) * (180/Math.PI);
      el.setAttribute("transform", `translate(${q.sx.toFixed(2)} ${q.sy.toFixed(2)})`);
      el.children[0].setAttribute("r", (r*3.6).toFixed(1));
      el.children[0].setAttribute("opacity", ((on?.34:.15)*Math.max(0,vis)).toFixed(2));
      el.children[1].setAttribute("transform", `scale(${(r/5.2).toFixed(3)}) rotate(${spin.toFixed(1)})`);
      el.children[1].setAttribute("opacity",
        (Math.max(0.12, vis) * (0.78 + 0.22*Math.sin(t*0.0014 + s.ph))).toFixed(2));
      el.children[2].setAttribute("r", (r*4).toFixed(1));
      (q.z > 0 ? back : front).push(el);
    });
    backG.replaceChildren(...back);
    frontG.replaceChildren(...front);

    chains.forEach((idxs,i) => {
      const pts = idxs.map(id => stars[id].q);
      cEls[i].setAttribute("d", pts.map((q,k)=>`${k?"L":"M"}${q.sx.toFixed(1)},${q.sy.toFixed(1)}`).join(" "));
      const avg = pts.reduce((a,q)=>a+q.sc,0)/pts.length;
      cEls[i].setAttribute("opacity", Math.max(0, (avg-0.74)*3).toFixed(2));
    });

    counts.forEach((p,k) => {
      const q = stars[p.i] && stars[p.i].q; const el = pEls[k];
      if (!q || !el) return;
      el.style.left = ((q.sx/SPH.W)*100).toFixed(2)+"%";
      el.style.top  = ((q.sy/SPH.H)*100).toFixed(2)+"%";
      el.style.transform = `translate(-50%,-165%) scale(${(q.sc*1.05).toFixed(2)})`;
      el.style.opacity = Math.max(0, (q.sc-0.74)*3.4).toFixed(2);
      el.style.zIndex = Math.round((2-q.sc)*100);
      el.style.pointerEvents = q.z > 0 ? "none" : "auto";
    });
    mapRAF = requestAnimationFrame(tick);
  };
  tick(0);
  if (reduce) stopMap();

  starEls.forEach(g => { g.onclick = () => { selLight = (selLight===g.dataset.id)?null:g.dataset.id; render(); }; });
  pEls.forEach(el => { el.onclick = () => {
    const mine = entries.filter(e => e.name === el.dataset.nm);
    selLight = mine.length ? mine[mine.length-1].id : null; render();
  }; });
}

function buildField(names) {
  const svg = document.getElementById("field");
  const pillBox = document.getElementById("pills");
  if (!svg) return;
  const W = 400, H = 460;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 별
  const stars = [];
  for (let i=0;i<64;i++) {
    const lit = Math.random() < 0.28;
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: lit ? 2.0 + Math.random()*0.9 : 1.5 + Math.random()*0.7,
      lit, ph: Math.random()*Math.PI*2,
      ax: 3 + Math.random()*5, ay: 3 + Math.random()*5,
      sp: 0.00016 + Math.random()*0.00022,
    });
  }
  // 성좌 연결선 (밝은 별 중 일부를 이어줌)
  const litIdx = stars.map((s,i)=>s.lit?i:-1).filter(i=>i>=0);
  const paths = [];
  for (let k=0;k<3;k++) {
    const pts = [];
    for (let m=0;m<4;m++) pts.push(litIdx[(k*4+m) % litIdx.length]);
    paths.push(pts);
  }
  // 이름표
  const spots = [{x:12,y:30},{x:46,y:56},{x:60,y:78}];
  const labels = names.length ? names : ["기도", "빛", "함께"];
  pillBox.innerHTML = labels.slice(0,3).map((n,i)=>`
    <span class="pill p${i}" style="left:${spots[i].x}%;top:${spots[i].y}%">
      <i class="pdot"></i>${esc(n)}
    </span>`).join("");

  let starEls = "", pathEls = "";
  paths.forEach((_,i)=> pathEls += `<path class="cline" id="cl${i}"/>`);
  stars.forEach((s,i)=> starEls += `<circle class="st ${s.lit?"lit":""}" id="s${i}" r="${s.r}"/>`);
  svg.innerHTML = `<defs><filter id="gl"><feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${pathEls}${starEls}`;

  const nodes = stars.map((_,i)=>document.getElementById("s"+i));
  const lines = paths.map((_,i)=>document.getElementById("cl"+i));

  const tick = (t) => {
    stars.forEach((s,i)=>{
      const dx = Math.sin(t*s.sp + s.ph) * s.ax;
      const dy = Math.cos(t*s.sp*0.8 + s.ph) * s.ay;
      s.cx = s.x + dx; s.cy = s.y + dy;
      const n = nodes[i];
      n.setAttribute("cx", s.cx.toFixed(1));
      n.setAttribute("cy", s.cy.toFixed(1));
      if (s.lit) n.setAttribute("opacity", (0.65 + 0.35*Math.sin(t*0.0012 + s.ph)).toFixed(2));
    });
    paths.forEach((pts,i)=>{
      const d = pts.map((idx,k)=>`${k?"L":"M"}${stars[idx].cx.toFixed(1)},${stars[idx].cy.toFixed(1)}`).join(" ");
      lines[i].setAttribute("d", d);
    });
    fieldRAF = requestAnimationFrame(tick);
  };
  if (reduce) { tick(0); stopField(); } else { fieldRAF = requestAnimationFrame(tick); }
}

function bindTopTabs() {
  document.querySelectorAll(".topbar-tab").forEach(b => {

      const next = b.dataset.t;
      if (!next || gnbTab === next) return;

      gnbTab = next;

      window.scrollTo({ top: 0, behavior: "smooth" });
    };

function bindMemberCards(root = document) {
  root.querySelectorAll(".mem[data-m]").forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.m;

      render();

function bindFlowInteractions(root = document) {
  root.querySelectorAll(".flow-item").forEach(el => {
    el.onclick = () => { flowSel = el.dataset.id; flowDone = null; render(); };
  });
  const flowBack = root.querySelector("#flowBack");
  if (flowBack) flowBack.onclick = () => { flowSel = null; flowDone = null; render(); };
  const flowForm = root.querySelector("#flowForm");
  if (flowForm) {
    flowForm.onsubmit = async (e) => {
      e.preventDefault();
      const name = root.querySelector("#flowName").value.trim();
      const phone = root.querySelector("#flowPhone").value.trim();
      if (!name || !phone) return;
      const submitBtn = root.querySelector("#flowSubmit");
      submitBtn.disabled = true; submitBtn.textContent = "신청 중…";
      await submitFlow(flowSel, name, phone);
      flowDone = flowSel;
      render();
    };
  }
}

function bindPrayerTyping(target) {
  const tb = document.getElementById("tb"), tg = document.getElementById("tg"), dn = document.getElementById("dn");
  const pf = document.getElementById("pf"), pc = document.getElementById("pc");
  const amb = document.getElementById("ambient"), parts = document.getElementById("particles");
  const card = document.getElementById("prayCard");
  const CAPS = ["한 글자씩 적으며 함께 기도해요","작은 빛이 비치기 시작합니다","어둠이 조금씩 걷히고 있습니다","빛이 번지고 있습니다","이제 곧 하나의 빛이 됩니다"];
  const lerp = (a,b,t)=>a+(b-a)*t;
  const mix = (c1,c2,t)=>`rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`;
  let lastLen = 0;

  const draw = () => {
    const v = tb.value;
    let h = "";
    for (let k=0;k<target.length;k++) {
      let c = "u";
      if (k < v.length) c = v[k] === target[k] ? "ok" : "no";
      else if (k === v.length) c = "cur";
      h += `<span class="ch ${c}">${esc(target[k])}</span>`;
    }
    tg.innerHTML = h;

    const p = Math.min(1, v.length / target.length);
    document.body.style.background = mix([5,7,14],[30,24,20],p);
    amb.style.background = `radial-gradient(circle at 50% 62%, rgba(255,198,120,${(p*0.14).toFixed(3)}), transparent 62%)`;
    card.style.borderColor = `rgba(217,163,85,${(0.09+p*0.42).toFixed(2)})`;
    card.style.boxShadow = `0 0 ${(p*54).toFixed(0)}px rgba(255,190,110,${(p*0.16).toFixed(2)})`;
    pf.style.width = (p*100)+"%";
    pc.textContent = CAPS[Math.min(4, Math.floor(p*4.999))];

    if (v.length > lastLen && parts) {
      for (let k=0;k<2;k++) {
        const sp = document.createElement("span");
        sp.className = "pt";
        sp.style.left = (12+Math.random()*76)+"%";
        sp.style.bottom = (10+Math.random()*30)+"%";
        sp.style.animationDelay = (Math.random()*0.2).toFixed(2)+"s";
        parts.appendChild(sp);
        setTimeout(()=>sp.remove(), 3000);
      }
    }
    lastLen = v.length;
    dn.disabled = (v !== target);
  };
  tb.oninput = draw; draw();

  dn.onclick = () => finish();
  const hd = document.getElementById("hd");
  hd.addEventListener("pointerdown", () => startHold(hd));
  hd.addEventListener("pointerup", cancelHold);
  hd.addEventListener("pointerleave", cancelHold);
  hd.addEventListener("contextmenu", e => e.preventDefault());
}

function showTip() {
  const box = document.getElementById("tip");
  if (!box) return;
  if (!selLight) { box.innerHTML = entries.length ? `<p class="quiet" style="margin-top:10px">지도의 빛을 누르면 그 기도를 볼 수 있어요</p>` : ""; return; }
  const e = entries.find(x => x.id === selLight);
  if (!e) { box.innerHTML = ""; return; }
  const [y,m,d] = e.date.split("-");
  box.innerHTML = `<div class="tip">
    <div class="tip-n">${esc(e.name)}<span>${Number(m)}월 ${Number(d)}일 · DAY ${e.day || dayIndex(e.date)}</span></div>
    <div class="tip-t">${esc(e.topic || setOf(e.date).topic)}</div></div>`;
}

function startHold(btn) {
  if (holdT) return;
  holdT = setInterval(() => {
    holdP += 100/60;
    if (btn) btn.textContent = `기도하는 중… ${Math.min(100,Math.round(holdP))}%`;
    if (holdP >= 100) { cancelHold(); finish(); }
  }, 50);
}
function cancelHold() {
  if (holdT) { clearInterval(holdT); holdT = null; }
  holdP = 0;
  const b = document.getElementById("hd");
  if (b) b.textContent = "타이핑이 어려우면 · 3초 길게 눌러 기도";
}

    name: nick, date: todayStr(), ts: Date.now(), day: set.day, topic: set.topic };

    <div class="burst"></div>
    <div class="flame">🕯️</div>
    <div class="done-t">당신의 기도가<br>방글라데시의 작은 빛이 되었습니다</div>
    <div class="done-s">${esc(nick)} · ${new Date().getMonth()+1}월 ${new Date().getDate()}일</div>
    <div class="done-tap">화면을 누르면 지도로 돌아갑니다</div>
  </div>`;
  document.getElementById("done").onclick = () => {
    ov.innerHTML = ""; selLight = en.id;
    document.body.style.background = "";

/* ── 백업 ── */
function exportLog() {
  const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), entries }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `팀알로-기도의빛-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(a.href);
}
async function importLog(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const n = mergeInto(entries, parsed.entries || []);
    writeLocal(entries);
    if (fbOK) for (const e of entries) await pushRemote(e);
    alert(`${n}개의 빛을 불러왔어요. (전체 ${entries.length}개)`); render();
  } catch { alert("파일을 읽지 못했어요."); }
}

  const r = await store.get("my-nick");
  if (r && r.value) { nick = r.value; nickSet = true; }
  entries = readLocal();
  render();
  entries = await syncAll();
  render();
  setInterval(async () => {
    if (document.getElementById("done")) return;
    const tb = document.getElementById("tb");
    if (tb && tb.value.length > 0) return;
    const before = entries.length;
    entries = await syncAll();
    if (entries.length !== before) render();
  }, 12000);
})();
</script>
